function pushInit(){
  var P=S.push;
  P.supported=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  P.ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  P.standalone=mq('(display-mode: standalone)')||navigator.standalone===true;
  P.permission=('Notification' in window)?Notification.permission:'unsupported';
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    swReg=reg;if(!P.supported)return;
    return reg.pushManager.getSubscription().then(function(sub){P.subscribed=!!sub;if(sub)saveSub(sub);render();});
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('message',function(e){
    var d=e.data||{};if(d.type!=='open'||typeof d.url!=='string')return;
    var h=d.url.split('#')[1];if(h&&/^[A-Za-z0-9-]+$/.test(h))location.hash=h;

function saveSub(sub){
  if(!S.uid||!sub||!sb)return Promise.resolve();

  var P=S.push;

  if(!P.supported){toast('This browser can’t show notifications.');return;}
  P.busy=true;render();
  Notification.requestPermission().then(function(perm){
    P.permission=perm;
    if(perm!=='granted'){P.busy=false;render();if(perm==='denied')toast('Notifications are blocked. Turn them on in your phone’s Settings.');return;}
    return (swReg?Promise.resolve(swReg):navigator.serviceWorker.ready).then(function(reg){
      swReg=reg;
      return reg.pushManager.getSubscription().then(function(sub){return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToBytes(VAPID_PUBLIC)});});
    }).then(function(sub){return saveSub(sub);}).then(function(){P.subscribed=true;P.busy=false;celebrate();toast('Notifications are on');render();});
  }).catch(function(){P.busy=false;toast('Couldn’t turn on notifications. Try again.');render();});

  }).then(function(){P.subscribed=false;toast('Notifications are off on this device');render();},function(){render();});
}

function myEntry(){for(var i=0;i<S.leagueEntries.length;i++)if(S.leagueEntries[i].captain_id===S.uid)return S.leagueEntries[i];return null;}
function entryName(id){for(var i=0;i<S.leagueEntries.length;i++)if(S.leagueEntries[i].id===id){var e=S.leagueEntries[i];return e.name+(e.partner?' & '+e.partner:'');}return 'Removed entry';}
function standings(){
  var t={};
  S.leagueEntries.forEach(function(e){t[e.id]={id:e.id,name:entryName(e.id),captain:e.captain_id,p:0,w:0,l:0,d:0,f:0,a:0,pts:0};});
  S.leagueMatches.forEach(function(m){
    if(m.score_a==null||!t[m.entry_a]||!t[m.entry_b])return;
    var A=t[m.entry_a],B=t[m.entry_b];A.p++;B.p++;A.f+=m.score_a;A.a+=m.score_b;B.f+=m.score_b;B.a+=m.score_a;
    if(m.score_a>m.score_b){A.w++;B.l++;A.pts+=2;}else if(m.score_b>m.score_a){B.w++;A.l++;B.pts+=2;}else{A.d++;B.d++;A.pts++;B.pts++;}
  });
  return Object.keys(t).map(function(k){return t[k];}).sort(function(a,b){return b.pts-a.pts||(b.f-b.a)-(a.f-a.a)||b.f-a.f||a.name.localeCompare(b.name);});
}
/* Round robin: the circle method; with an odd number one entry sits out each round */
function roundRobin(ids){
  var list=ids.slice();if(list.length%2)list.push(null);
  var n=list.length,out=[];
  for(var r=0;r<n-1;r++){
    for(var i=0;i<n/2;i++){var a=list[i],b=list[n-1-i];if(a&&b)out.push({round:r+1,entry_a:r%2?b:a,entry_b:r%2?a:b});}
    list.splice(1,0,list.pop());
  }
  return out;
}

function matchesHTML(l,admin,me){

function joinLeague(){

function refreshLeague(){Promise.all([loadLeague(),loadLeagues()]).catch(function(){}).then(render);}
function setLeagueStatus(status){
  var l=S.league;if(!l)return;
  S.busy=true;render();
  var start=status==='running'&&l.status==='open'&&l.format==='round_robin'&&!S.leagueMatches.length;
  var p=start?sb.from('league_matches').insert(roundRobin(S.leagueEntries.map(function(e){return e.id;})).map(function(m){return Object.assign({league_id:l.id},m);})):Promise.resolve({error:null});
  p.then(function(r){
    if(r.error)throw r.error;
    return sb.from('leagues').update({status:status}).eq('id',l.id);
  }).then(function(r){

function saveScore(id){
  var a=document.getElementById('sa-'+id),b=document.getElementById('sb-'+id);
  var sa=a?Number(a.value):NaN,sbv=b?Number(b.value):NaN;
  if(!(a&&b&&a.value!==''&&b.value!==''&&sa>=0&&sa<=99&&sbv>=0&&sbv<=99&&sa%1===0&&sbv%1===0)){toast('Enter both scores, 0 to 99.');return;}
  S.busy=true;
  sb.from('league_matches').update({score_a:sa,score_b:sbv}).eq('id',id).select('id').then(function(r){
    S.busy=false;
    if(r.error||(Array.isArray(r.data)&&!r.data.length)){toast('Only the two sides or the organiser can enter this score.');render();return;}
    S.scoreEdit=null;toast('Score saved');refreshLeague();
  });
}
function saveLadder(){
  var R=S.ladderForm,me=myEntry(),l=S.league;if(!R||!me||!l)return;

/* ================= Payments: Apple Pay, Google Pay and cards through Stripe ================= */
var BOOKING_FEE=0.99;
I.lock='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
function cents$(c){c=Number(c)||0;return '$'+(c/100).toFixed(2).replace(/\.00$/,'');}
function payTotal(g){return '$'+(g.price+BOOKING_FEE).toFixed(2);}
function payInvoke(body){
  return sb.functions.invoke('payments',{body:body}).then(function(r){
    if(r.error)throw r.error;var d=r.data||{};if(d.ok===false)throw new Error(d.error||'FAILED');return d;
  });
}
function payError(e){
  var m=String(e&&e.message||'');
  return {GAME_FULL:'That game just filled up. Join the waitlist and you’ll hear if a spot opens.',ALREADY_IN:'You’re already in this game.',IS_HOST:'You’re hosting this game.',
    HOST_NOT_READY:'The host can’t take payments right now. Ask them to check their payout setup.',GAME_FINISHED:'That game has already finished.',
    NO_STRIPE_KEY:'Payments aren’t switched on yet.',NOT_PAID_GAME:'This game doesn’t take payment in the app.'}[m]||'Couldn’t start the payment. Check your connection and try again.';
}
function startCheckout(id){
  if(needLogin('g-'+id)||S.paying)return;
  S.paying=id;render();
  payInvoke({action:'checkout',game_id:id}).then(function(d){
    if(!/^https:\/\/checkout\.stripe\.com\//.test(d.url||''))throw new Error('FAILED');
    location.href=d.url;
  }).catch(function(e){S.paying=null;toast(payError(e));render();});
}
function loadPayout(){
  if(!S.uid){S.payout=null;return Promise.resolve();}
  return sb.from('payout_accounts').select('*').eq('user_id',S.uid).maybeSingle().then(function(r){if(!r.error)S.payout=r.data||null;});
}
function loadHostPayments(){
  if(!S.uid||S.route!=='payouts')return Promise.resolve();
  return sb.from('payments').select('id, game_id, game_title, amount_cents, fee_cents, status, refund_cents, paid_at, created_at').eq('host_id',S.uid).in('status',['paid','refunded']).order('created_at',{ascending:false}).limit(60)
    .then(function(r){if(!r.error)S.hostPayments=r.data||[];});
}
function loadGamePayments(){

var RET=(function(){

function handleReturn(){

        var inNow=S.gameId===o.game&&S.players.some(function(p){return p.user_id===S.uid;});

/* Minimal DOM morph: walks old and new trees in step and patches differences in place */
function syncControl(a,b){
  if(a===document.activeElement)return;
  if(a.nodeName==='INPUT'){if(a.type==='checkbox'||a.type==='radio'){if(a.checked!==b.checked)a.checked=b.checked;}else if(a.type!=='file'&&a.value!==b.value)a.value=b.value;}
  else if(a.nodeName==='TEXTAREA'){if(a.value!==b.value)a.value=b.value;}
  else if(a.nodeName==='SELECT'){if(a.value!==b.value)a.value=b.value;}
}
function morphNode(a,b){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  var tag=a.nodeName,i;
  if(!a.isEqualNode(b)){
    for(i=a.attributes.length-1;i>=0;i--){var n=a.attributes[i].name;if(!b.hasAttribute(n))a.removeAttribute(n);}
    for(i=0;i<b.attributes.length;i++){var at=b.attributes[i];if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
    if(tag!=='IFRAME'&&tag!=='TEXTAREA'){
      var kids=Array.prototype.slice.call(b.childNodes);
      for(i=0;i<kids.length;i++){
        var an=a.childNodes[i],bn=kids[i];
        if(!an)a.appendChild(bn);
        else if(an.nodeType===bn.nodeType&&an.nodeName===bn.nodeName&&(an.nodeType!==1||an.id===bn.id))morphNode(an,bn);
        else a.replaceChild(bn,an);
      }
      while(a.childNodes.length>kids.length)a.removeChild(a.lastChild);
    }
  }
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')syncControl(a,b);
}

/* Desktop: a small player card appears when the pointer rests on a player's name or photo */
var hc={timer:null,el:null,cache:{}};
function hideHover(){clearTimeout(hc.timer);hc.el=null;var c=document.getElementById('hovercard');if(c)c.remove();}
function showHover(a,p){
  var nm=p.display_name||'Bounce player';
  var c=document.createElement('div');c.id='hovercard';c.className='hovercard';c.setAttribute('aria-hidden','true');
  c.innerHTML='<div class="profile-head">'+avatar(p.id,nm,p.avatar_url,44)+'<div style="min-width:0"><h3>'+esc(nm)+'</h3><p class="meta">'+esc([p.suburb,p.level&&p.level!=='All levels'?p.level:''].filter(Boolean).join(' · ')||'Bounce player')+'</p></div></div>'+
    (p.bio?'<p class="bio">'+esc(p.bio)+'</p>':'')+(p.sports&&p.sports.length?sportsChips(p.sports.filter(function(s){return SPORT_LABEL[s];}).slice(0,4)):'');
  document.body.appendChild(c);
  var r=a.getBoundingClientRect(),w=c.offsetWidth,ht=c.offsetHeight;
  var left=Math.min(Math.max(8,r.left),window.innerWidth-w-8),top=r.bottom+8;
  if(top+ht>window.innerHeight-8)top=Math.max(8,r.top-ht-8);
  c.style.left=left+'px';c.style.top=top+'px';
}
document.addEventListener('mouseover',function(e){
  if(!sb||!mq('(hover:hover) and (min-width:1024px)'))return;
  var a=e.target&&e.target.closest?e.target.closest('a[href^="#p-"]'):null;
  if(a===hc.el)return;
  hideHover();
  if(!a)return;
  var id=a.getAttribute('href').slice(3);if(!ID_RE.test(id))return;
  hc.el=a;
  hc.timer=setTimeout(function(){
    var cached=hc.cache[id];
    (cached?Promise.resolve(cached):sb.from('profiles').select('id, display_name, avatar_url, suburb, level, sports, bio, dupr_id, dupr_doubles, dupr_singles').eq('id',id).maybeSingle().then(function(r){if(r&&r.data)hc.cache[id]=r.data;return r&&r.data;}))
      .then(function(p){if(p&&hc.el===a)showHover(a,p);}).catch(function(){});
  },400);
});
$main.addEventListener('scroll',hideHover,{passive:true});
var render=paint;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},2800);}
function celebrate(){
  try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  var ball=ballSVG('plain',false);
  var colors=['#FF8A3D','#1F5C4A','#FFD23F','#8FB8FF','#7FC4A8'],dots='';
  for(var i=0;i<16;i++)dots+='<span style="--a:'+((i/16)*360+Math.random()*12)+'deg;--d:'+(70+Math.random()*60)+'px;background:'+colors[i%5]+'"></span>';
  var el=document.createElement('div');el.className='celebrate';el.setAttribute('aria-hidden','true');
  el.innerHTML='<div class="celebrate-ball">'+ball+'</div><div class="burst">'+dots+'</div>';
  document.body.appendChild(el);setTimeout(function(){el.remove();},1700);
}

/* ---------- data ---------- */
function loadGames(){
  var since=new Date(Date.now()-6*3600*1000).toISOString();
  return sb.from('games').select(GAME_SELECT).gte('starts_at',since).order('starts_at').limit(300).then(function(r){
    if(r.error){S.loadError='Couldn’t load games. Check your connection and reopen Bounce.';}
    else{S.loadError='';S.games=(r.data||[]).map(normGame);}
    S.loaded=true;
  });
}
var GAME_SELECT='*, game_players(count), waitlist(count), club:clubs(id, name, logo_url)';
function loadMine(){
  if(!S.uid){S.mine=null;S.myIds={};S.myWait=null;S.waitIds={};return Promise.resolve();}
  return Promise.all([
    sb.from('game_players').select('game:games('+GAME_SELECT+')').eq('user_id',S.uid),
    sb.from('waitlist').select('game:games('+GAME_SELECT+')').eq('user_id',S.uid),
    sb.from('games').select(GAME_SELECT).eq('host_id',S.uid).order('starts_at',{ascending:false}).limit(100)
  ]).then(function(res){
    if(res[0].error)return;
    var games=(res[0].data||[]).map(function(x){return x.game;}).filter(Boolean).map(normGame),have={};
    games.forEach(function(g){have[g.id]=1;});
    if(!res[2].error)(res[2].data||[]).forEach(function(x){var g=normGame(x);if(!have[g.id]){have[g.id]=1;games.push(g);}});
    var hadWait=S.myWait!==null,prevWait=S.waitIds;
    S.mine=games;S.myIds={};games.forEach(function(g){S.myIds[g.id]=true;});
    if(!res[1].error){
      S.myWait=(res[1].data||[]).map(function(x){return x.game;}).filter(Boolean).map(normGame);
      S.waitIds={};S.myWait.forEach(function(g){S.waitIds[g.id]=true;});
    }
    // Promoted off a waitlist since the last check: tell the player straight away
    if(hadWait)games.forEach(function(g){if(prevWait[g.id]&&!S.waitIds[g.id]){celebrate();toast('A spot opened. You’re in: '+g.title);}});
  });
}
function loadProfile(){
  if(!S.uid){S.profile=null;S.pf=null;return Promise.resolve();}
  return sb.from('profiles').select('*').eq('id',S.uid).maybeSingle().then(function(r){
    S.profile=r.data||null;
    if(!S.pfDirty){var p=S.profile||{};S.pf={display_name:p.display_name||'',suburb:p.suburb||'',bio:p.bio||'',level:p.level||'All levels',sports:(p.sports||[]).slice(),duprId:p.dupr_id||'',duprDoubles:p.dupr_doubles!=null?String(Number(p.dupr_doubles)):'',duprSingles:p.dupr_singles!=null?String(Number(p.dupr_singles)):''};}
    if(S.profile&&!S.form.suburb&&S.profile.suburb)S.form.suburb=S.profile.suburb;
  });
}
function loadGame(){
  if(S.route!=='game'||!S.gameId)return Promise.resolve();
  var id=S.gameId;
  return Promise.all([
    sb.from('games').select('*, host:profiles!games_host_id_fkey(id, display_name, avatar_url), club:clubs(id, name, logo_url)').eq('id',id).maybeSingle(),
    sb.from('game_players').select('user_id, joined_at, profile:profiles(id, display_name, avatar_url)').eq('game_id',id).order('joined_at'),
    sb.from('waitlist').select('user_id, created_at, profile:profiles(id, display_name, avatar_url)').eq('game_id',id).order('created_at')
  ]).then(function(res){
    if(S.gameId!==id)return;
    S.game=res[0].data?normGame(res[0].data):null;
    S.players=res[1].data||[];
    S.waiting=res[2].error?[]:(res[2].data||[]);
    S.gameState='ready';
    var inGame=!!S.uid&&S.game&&(S.game.hostId===S.uid||S.players.some(function(p){return p.user_id===S.uid;}));
    if(!inGame){S.messages=[];return;}
    return sb.from('messages').select('id, body, created_at, user_id, profile:profiles(id, display_name, avatar_url)').eq('game_id',id).order('created_at',{ascending:false}).limit(100).then(function(m){
      if(S.gameId===id&&!m.error){S.messages=(m.data||[]).reverse();markRead('game:'+id);}
    });
  });
}

var POST_SELECT='*, club:clubs(id, name, logo_url), author:profiles(id, display_name, avatar_url), post_likes(count), post_comments(count)';
function inGames(id){for(var i=0;i<S.games.length;i++)if(S.games[i].id===id)return true;return false;}
function loadFeed(){
  var forClub=S.route==='club'?S.clubId:null;
  if(S.route!=='feed'&&!forClub)return Promise.resolve();
  var ids=S.myClubs.filter(function(m){return m.club;}).map(function(m){return String(m.club.id);});
  var q=sb.from('club_posts').select(POST_SELECT).order('created_at',{ascending:false}).limit(forClub?20:40);
  if(forClub)q=q.eq('club_id',forClub);else if(ids.length)q=q.in('club_id',ids);
  return q.then(function(r){
    if(forClub&&S.clubId!==forClub)return;
    var posts=r.error?[]:(r.data||[]).map(normPost);
    if(forClub)S.clubPosts=posts;else S.feed=posts;
    var jobs=[],pids=posts.map(function(p){return p.id;});
    if(S.uid&&pids.length)jobs.push(sb.from('post_likes').select('post_id').eq('user_id',S.uid).in('post_id',pids).then(function(l){
      if(l.error)return;pids.forEach(function(id){delete S.liked[id];});(l.data||[]).forEach(function(x){S.liked[x.post_id]=true;});
    }));
    var missing=[];posts.forEach(function(p){p.gameIds.forEach(function(g){if(!inGames(g)&&missing.indexOf(g)<0)missing.push(g);});});
    if(missing.length)jobs.push(sb.from('games').select(GAME_SELECT).in('id',missing).then(function(gr){
      if(!gr.error)(gr.data||[]).forEach(function(x){var g=normGame(x);S.gameCache[g.id]=g;});
    }));
    Object.keys(S.openComments).forEach(function(pid){if(pids.indexOf(pid)>=0)jobs.push(loadComments(pid));});
    return Promise.all(jobs);
  });
}
function eachPost(id,fn){(S.feed||[]).concat(S.clubPosts||[]).forEach(function(p){if(p.id===id)fn(p);});}
function findPost(id){var f=null;eachPost(id,function(p){f=f||p;});return f;}
function loadComments(pid){
  return sb.from('post_comments').select('id, body, created_at, user_id, profile:profiles(id, display_name, avatar_url)').eq('post_id',pid).order('created_at').limit(200).then(function(r){
    if(r.error)return;S.comments[pid]=r.data||[];eachPost(pid,function(p){p.comments=S.comments[pid].length;});
  });
}

function toggleLike(pid){
  if(needLogin(currentHash()))return;
  var on=!S.liked[pid];
  S.liked[pid]=on;eachPost(pid,function(p){p.likes=Math.max(0,p.likes+(on?1:-1));});render();
  var req=on?sb.from('post_likes').insert({post_id:pid,user_id:S.uid}):sb.from('post_likes').delete().eq('post_id',pid).eq('user_id',S.uid);
  req.then(function(r){
    if(r.error&&!/duplicate key/i.test(r.error.message||'')){S.liked[pid]=!on;eachPost(pid,function(p){p.likes=Math.max(0,p.likes+(on?-1:1));});toast('Couldn’t save that. Try again.');render();}
  });

function sharePost(pid){
  var p=findPost(pid);if(!p)return;
  var url=location.origin+location.pathname+'#c-'+p.clubId;
  var text=p.club.name+' on Bounce'+(p.body?': '+p.body.slice(0,140)+(p.body.length>140?'…':''):'');

/* Photos are shrunk on the phone (longest side 1600px, JPEG) before upload, so posting is quick on mobile data */
function shrinkImage(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h,1));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){if(b)resolve(b);else reject(new Error('encode'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('decode'));};
    img.src=url;
  });
}
/* Profile photos and club logos: squared on the phone (photos fill the circle, logos fit whole on white), then uploaded */
var STORAGE_PUBLIC=String(CONFIG.SUPABASE_URL).replace(/\/$/,'')+'/storage/v1/object/public/';
function squareImage(file,size,fit){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth||1,h=img.naturalHeight||1,c=document.createElement('canvas');c.width=c.height=size;
      var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,size,size);
      var sc=fit==='contain'?Math.min(size*0.88/w,size*0.88/h):Math.max(size/w,size/h),dw=w*sc,dh=h*sc;
      x.imageSmoothingQuality='high';x.drawImage(img,(size-dw)/2,(size-dh)/2,dw,dh);URL.revokeObjectURL(url);
      c.toBlob(function(b){if(b)resolve(b);else reject(new Error('encode'));},'image/jpeg',0.86);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('decode'));};
    img.src=url;
  });
}
function isImageFile(file){if(file&&/^image\//.test(file.type))return true;toast('Pick a photo or image (JPEG, PNG or HEIC).');return false;}
/* Tidy up a replaced picture. Only works for files this person uploaded; anything else is simply left. */
function forgetStored(bucket,url){
  var pre=STORAGE_PUBLIC+bucket+'/';
  if(sb&&typeof url==='string'&&url.indexOf(pre)===0)sb.storage.from(bucket).remove([url.slice(pre.length)]).then(function(){},function(){});
}
function pickAvatar(file){
  if(!S.uid||S.photoBusy||!isImageFile(file))return;
  var old=S.profile&&S.profile.avatar_url,path=S.uid+'/'+Date.now()+'.jpg';
  S.photoBusy='me';render();
  squareImage(file,512,'cover').then(function(b){
    return sb.storage.from('avatars').upload(path,b,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
  }).then(function(r){
    if(r.error)throw r.error;
    var url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    return sb.from('profiles').update({avatar_url:url}).eq('id',S.uid).then(function(u){if(u.error)throw u.error;return url;});
  }).then(function(url){
    forgetStored('avatars',old);
    if(S.profile)S.profile.avatar_url=url;
    S.photoBusy=null;toast('Photo updated');render();refreshAll();
  },function(e){S.photoBusy=null;toast(friendlyError(e,'Couldn’t upload the photo. Try a different one.'));render();});
}
function removeAvatar(){
  if(!S.uid||S.photoBusy)return;
  var old=S.profile&&S.profile.avatar_url;
  S.photoBusy='me';render();
  sb.from('profiles').update({avatar_url:null}).eq('id',S.uid).then(function(r){
    S.photoBusy=null;
    if(r.error){toast('Couldn’t remove the photo. Try again.');render();return;}
    forgetStored('avatars',old);
    if(S.profile)S.profile.avatar_url=null;
    toast('Photo removed');render();refreshAll();
  });
}
function uploadLogo(cid,blob){
  var path=cid+'/logo-'+Date.now()+'.jpg';
  return sb.storage.from('club-photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false}).then(function(r){
    if(r.error)throw r.error;
    return sb.storage.from('club-photos').getPublicUrl(path).data.publicUrl;
  });
}
function pickClubLogo(cid,file){
  if(!cid||S.photoBusy||!isImageFile(file))return;
  var old=S.club&&S.club.id===cid?S.club.logo:'';
  S.photoBusy='club-'+cid;render();
  squareImage(file,512,'contain').then(function(b){return uploadLogo(cid,b);}).then(function(url){
    return sb.from('clubs').update({logo_url:url}).eq('id',cid).select('id').then(function(r){
      if(r.error)throw r.error;
      if(Array.isArray(r.data)&&!r.data.length)throw new Error('committee');
      return url;
    });
  }).then(function(url){
    forgetStored('club-photos',old);
    if(S.club&&S.club.id===cid)S.club.logo=url;
    S.photoBusy=null;toast('Club logo updated');render();refreshAll();
  },function(e){
    S.photoBusy=null;
    toast(String(e&&e.message)==='committee'?'Only the club committee can change the logo.':friendlyError(e,'Couldn’t upload the logo. Try a different image.'));render();
  });

function setFormLogo(file){
  var f=S.clubForm;if(!f||!isImageFile(file))return;
  f.logoBusy=true;render();
  squareImage(file,512,'contain').then(function(b){
    if(S.clubForm!==f)return;
    clearFormLogo(f);f.logoBlob=b;f.logoPreview=URL.createObjectURL(b);f.logoRemove=false;f.logoBusy=false;render();
  },function(){f.logoBusy=false;toast('That image couldn’t be read. Try another.');render();});
}
function clearFormLogo(f){if(f&&f.logoPreview){try{URL.revokeObjectURL(f.logoPreview);}catch(e){}}if(f){f.logoPreview='';f.logoBlob=null;}}
function addPhotos(list){
  var c=S.composer;if(!c||!list||!list.length)return;
  var files=Array.prototype.slice.call(list).filter(function(f){return /^image\//.test(f.type);}).slice(0,4-c.files.length);
  if(!files.length){toast('Pick photos (JPEG, PNG or HEIC).');return;}
  c.preparing=true;c.error='';render();
  files.reduce(function(chain,f){
    return chain.then(function(){return shrinkImage(f).then(function(b){if(S.composer===c&&c.files.length<4)c.files.push({blob:b,url:URL.createObjectURL(b)});},function(){toast('One photo couldn’t be read. Try another.');});});
  },Promise.resolve()).then(function(){c.preparing=false;if(S.composer===c)render();});
}
function submitPost(){
  var c=S.composer;if(!c||c.busy)return;
  var body=c.body.trim();
  if(!body&&!c.files.length){c.error='Write something or add a photo.';render();return;}
  if(!isClubAdmin(c.clubId)){c.error='Only the committee can post for this club.';render();return;}
  c.busy=true;c.error='';c.progress=c.files.length?'Uploading photos…':'Posting…';render();
  var urls=[],stamp=Date.now();
  c.files.reduce(function(chain,f,i){
    return chain.then(function(){
      c.progress='Uploading photo '+(i+1)+' of '+c.files.length+'…';render();
      var path=c.clubId+'/'+S.uid+'-'+stamp+'-'+i+'.jpg';
      return sb.storage.from('club-photos').upload(path,f.blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false}).then(function(r){
        if(r.error)throw r.error;
        urls.push(sb.storage.from('club-photos').getPublicUrl(path).data.publicUrl);
      });
    });
  },Promise.resolve()).then(function(){

/* Live updates: collect what changed for ~300ms, then reload only those parts */
var pending={};
function scheduleRefresh(kind){pending[kind||'all']=1;clearTimeout(refreshTimer);refreshTimer=setTimeout(flushRefresh,300);}
function flushRefresh(){
  var k=pending;pending={};
  if(k.all){refreshAll();return;}
  var jobs=[];
  if(k.games){jobs.push(loadGames(),loadMine());if(S.route==='game')jobs.push(loadGame());if(S.route==='club')jobs.push(loadClub());}
  else if(k.chat&&S.route==='game')jobs.push(loadGame());
  if(k.inbox&&S.route==='clubchat')jobs.push(loadClubChat());
  if(k.clubs){jobs.push(loadClubs(),loadMyClubs());if(S.route==='club')jobs.push(loadClub());}
  Promise.all(jobs).catch(function(){}).then(function(){
    var more=[];if(k.feed||k.games||k.clubs)more.push(loadFeed());if(k.chat||k.inbox||k.games||k.clubs)more.push(loadInbox());return Promise.all(more);
  }).catch(function(){}).then(render);

  if(id&&!ID_RE.test(id))return;
  if(clickPay(a,id)||clickExtra(a,id,v))return;
  // The sheet backdrop closes only when tapped directly, not when tapping blank space inside the sheet.
  if(a==='sheet-close'){if((b.classList.contains('sheet-back')||b.classList.contains('lightbox'))&&e.target!==b)return;closeSheet();return;}
  if(S.sheet&&S.sheet.type==='member'&&(a==='club-role'||a==='club-remove')){S.sheet=null;renderSheet();}
  if(a==='sport'){S.sport=v;render();}
  else if(a==='day'){S.day=v;render();}
  else if(a==='level'){S.level=(v==='all'||LEVELS.indexOf(v)>=0)?v:'all';render();}
  else if(a==='qf'){if(v==='near')S.near=!S.near;else if(v==='free')S.free=!S.free;else if(v==='beginner')S.level=S.level==='Beginner'?'all':'Beginner';render();}
  else if(a==='filters')openSheet({type:'filters'});
  else if(a==='filters-clear'){S.sport='all';S.day='all';S.level='all';S.free=false;S.near=false;render();}
  else if(a==='member-menu')openSheet({type:'member',id:id});
  else if(a==='host-step'){S.hostStep=Math.max(0,Math.min(3,Number(v)||0));S.formError='';render();}
  else if(a==='host-next')hostNext();
  else if(a==='push-on')enablePush();
  else if(a==='push-off')disablePush();
  else if(a==='push-test')testPush();
  else if(a==='notify-pref'&&['games','oneshort','clubs','chat'].indexOf(v)>=0)setNotifyPref(v);
  else if(a==='nudge-x'){try{localStorage.setItem('bounce-nudge','1');}catch(err){}render();}
  else if(a==='ib-filter'){S.inboxFilter=['all','unread','clubs','games'].indexOf(v)>=0?v:'all';render();}
  else if(a==='dview'||a==='mview'||a==='cview'){S[a]=v==='cal'?'cal':'list';render();}
  else if(a==='cal-month'){var cm=String(v||'').split('|'),ck=cm[0],cs=S.cal[ck];if(cs){var cy=Number(cs.m.slice(0,4)),cmo=Number(cs.m.slice(5,7))-1+(Number(cm[1])||0);cs.m=monthKey(new Date(cy,cmo,1));cs.d=null;render();}}
  else if(a==='cal-day'){var cd=String(v||'').split('|');if(cd.length===2&&/^\d{4}-\d{2}-\d{2}$/.test(cd[1])&&S.cal[cd[0]]){S.cal[cd[0]].d=S.cal[cd[0]].d===cd[1]?null:cd[1];render();}}
  else if(a==='cal-add')openSheet({type:'addcal',id:id});
  else if(a==='ics'){var ig=lookupGame(id);S.sheet=null;renderSheet();if(ig)downloadIcs([ig],ig.title);}
  else if(a==='ics-all')downloadIcs(myUpcoming(),'Bounce games');
  else if(a==='wait-join')joinWaitlist(id);
  else if(a==='wait-leave')leaveWaitlist(id);
  else if(a==='wait-remove')removeWaiting(id);
  else if(a==='pin-here')pinHere();
  else if(a==='pin-clear'){S.form.lat=null;S.form.lng=null;render();}
  else if(a==='like')toggleLike(id);
  else if(a==='comments')toggleComments(id);
  else if(a==='cmt-del'&&ID_RE.test(v||''))deleteComment(id,v);
  else if(a==='post-more'){S.expanded[id]=!S.expanded[id];render();}
  else if(a==='post-share')sharePost(id);
  else if(a==='post-menu')openSheet({type:'post',id:id});
  else if(a==='post-del'){S.sheet=null;deletePost(id);}
  else if(a==='photo')openSheet({type:'photo',id:id,i:Math.max(0,Math.min(3,Number(v)||0))});
  else if(a==='photo-step'&&S.sheet&&S.sheet.type==='photo'){var pp=findPost(S.sheet.id);if(pp){S.sheet.i=(S.sheet.i+(v==='prev'?-1:1)+pp.photos.length)%pp.photos.length;renderSheet();}}
  else if(a==='post-new')openComposer(id);
  else if(a==='post-cancel')closeComposer();
  else if(a==='post-submit')submitPost();
  else if(a==='pc-photo-remove'&&S.composer){var fi=Number(v)||0,rm=S.composer.files.splice(fi,1)[0];if(rm)try{URL.revokeObjectURL(rm.url);}catch(err){}render();}
  else if(a==='pc-game'&&S.composer){var gi=S.composer.gameIds.indexOf(id);if(gi>=0)S.composer.gameIds.splice(gi,1);else if(S.composer.gameIds.length<3)S.composer.gameIds.push(id);else toast('You can attach up to 3 games.');render();}
  else if(a==='join')join(id);
  else if(a==='leave')leave(id);
  else if(a==='oneshort')toggleOneShort(id);
  else if(a==='del'){S.confirmDel=true;render();}
  else if(a==='del-no'){S.confirmDel=false;render();}
  else if(a==='del-yes')deleteGame(id);
  else if(a==='invite')invite();
  else if(a==='login')goLogin(v);
  else if(a==='login-back'){S.login.step='choose';S.login.code='';S.login.link='';S.login.error='';render();}
  else if(a==='paste-link')pasteLink();
  else if(a==='oauth')oauth(v==='apple'?'apple':'google');
  else if(a==='signout'){forgetDevice().then(function(){return sb.auth.signOut();}).then(function(){location.hash='discover';});}
  else if(a==='pfsport'){var i=S.pf.sports.indexOf(v);if(i>=0)S.pf.sports.splice(i,1);else S.pf.sports.push(v);S.pfDirty=true;render();}
  else if(a==='club-new')newClub();
  else if(a==='club-sport'){S.clubSport=v;render();}
  else if(a==='cf-sport'&&S.clubForm){var j=S.clubForm.sports.indexOf(v);if(j>=0)S.clubForm.sports.splice(j,1);else S.clubForm.sports.push(v);render();}
  else if(a==='club-join')joinClub(id);
  else if(a==='club-leave')leaveClub(id);
  else if(a==='club-invite')inviteClub();
  else if(a==='club-host'){S.form=defaultForm();applyClubToForm(id);S.hostStep=0;location.hash='host';}
  else if(a==='club-edit'&&S.club){var c=S.club;S.clubForm={name:c.name,kind:c.kind,suburb:c.suburb,sports:c.sports.slice(),about:c.about,website:c.website,instagram:c.instagram,venue:c.venue,address:c.address,logo:c.logo};S.clubFormError='';S.clubEditing=true;render();}
  else if(a==='club-edit-cancel'){clearFormLogo(S.clubForm);S.clubEditing=false;render();}
  else if(a==='cf-logo-remove'&&S.clubForm){clearFormLogo(S.clubForm);S.clubForm.logoRemove=true;render();}
  else if(a==='pf-photo-remove')removeAvatar();
  else if(a==='club-del'){S.confirmClubDel=true;render();}
  else if(a==='club-del-no'){S.confirmClubDel=false;render();}
  else if(a==='club-del-yes')deleteClub(id);
  else if(a==='club-role')setClubRole(id,v);
  else if(a==='club-remove')removeClubMember(id);
});
function onField(e){
  var t=e.target,id=t.id;if(!id)return;
  if(fieldExtra(e))return;
  if(id==='q'){S.q=t.value;render();}
  else if(id==='hq'){
    // Header search (desktop): typing anywhere takes you to Discover with the results.
    if(e.type!=='input')return;
    S.q=t.value;if(S.route!=='discover')location.hash='discover';else render();
  }
  else if(id==='chat-input')S.draft=t.value;
  else if(id==='cc-input')S.ccDraft=t.value;
  else if(id.indexOf('ci-')===0)S.cdraft[id.slice(3)]=t.value;
  else if(id==='pc-body'&&S.composer)S.composer.body=t.value;
  else if(id==='pc-club'&&S.composer&&e.type==='change'){S.composer.clubId=t.value;S.composer.gameIds=[];render();}
  else if(id==='pc-files'){if(e.type==='change'){addPhotos(t.files);t.value='';}}
  else if(id==='f-clubId'){if(e.type==='change'){applyClubToForm(t.value);render();}}
  else if(id==='f-hostPlays'){S.form.hostPlays=t.checked;updatePreview();}
  else if(id==='f-oneshort'){S.form.oneShort=t.checked;updatePreview();}
  else if(id.indexOf('f-')===0){S.form[id.slice(2)]=t.value;updatePreview();if(id==='f-venue'||id==='f-address'||id==='f-suburb')updateWhereMap();}
  else if(id==='pf-photo'){if(e.type==='change'){pickAvatar(t.files&&t.files[0]);t.value='';}}
  else if(id==='club-logo-file'){if(e.type==='change'){pickClubLogo(S.club&&S.club.id,t.files&&t.files[0]);t.value='';}}
  else if(id==='cf-logofile'){if(e.type==='change'){setFormLogo(t.files&&t.files[0]);t.value='';}}
  else if(id==='pf-name'){S.pf.display_name=t.value;S.pfDirty=true;}
  else if(id==='pf-suburb'){S.pf.suburb=t.value;S.pfDirty=true;}
  else if(id==='pf-level'){S.pf.level=t.value;S.pfDirty=true;}
  else if(id==='pf-bio'){S.pf.bio=t.value;S.pfDirty=true;}
  else if(id==='club-q'){S.clubQ=t.value;render();}
  else if(id.indexOf('cf-')===0&&S.clubForm){S.clubForm[id.slice(3)]=t.value;}
  else if(id==='login-email')S.login.email=t.value;
  else if(id==='login-link')S.login.link=t.value;
  else if(id==='login-code'){var c=t.value.replace(/\D/g,'').slice(0,6);if(c!==t.value)t.value=c;S.login.code=c;}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(submitExtra(id))return;
  if(id==='host-form'){if(isPhone()&&S.hostStep<3)hostNext();else createGame();}
  else if(id==='chat-form')sendMsg();
  else if(id==='profile-form')saveProfile();
  else if(id==='email-form')sendCode();
  else if(id==='code-form')verifyCode();
  else if(id==='link-form')linkSignIn();
  else if(id==='club-form')saveClub();
  else if(id==='club-chat-form')sendClubMsg();
  else if(id.indexOf('cmt-')===0&&ID_RE.test(id.slice(4)))sendComment(id.slice(4));
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')scheduleRefresh('all');});
/* Keyboard: "/" jumps to search, "N" opens Host a game, Esc closes a sheet */
function focusSearch(){
  var hq=document.getElementById('hq');
  if(hq&&hq.offsetParent){hq.focus();hq.select();return;}
  var go=function(){var q=document.getElementById('q');if(q)q.focus();};
  if(S.route!=='discover'){location.hash='discover';setTimeout(go,80);}else go();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){hideHover();if(S.sheet){e.preventDefault();closeSheet();}return;}
  if(S.sheet&&S.sheet.type==='photo'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){var pp=findPost(S.sheet.id);if(pp){S.sheet.i=(S.sheet.i+(e.key==='ArrowLeft'?-1:1)+pp.photos.length)%pp.photos.length;renderSheet();}return;}
  if(e.metaKey||e.ctrlKey||e.altKey||e.isComposing||S.sheet)return;
  var t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
  if(e.key==='/'){e.preventDefault();focusSearch();}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();if(S.route!=='host')location.hash='host';}
});
/* Keep "Starts in…" countdowns fresh without re-rendering the page */
setInterval(function(){
  document.querySelectorAll('[data-start]').forEach(function(el){var d=new Date(el.getAttribute('data-start'));if(!isNaN(d.getTime()))el.textContent=countdown(d);});
},30000);

/* ---------- boot ---------- */
function setSession(session){
  var before=S.uid;
  S.session=session||null;
  S.uid=session&&session.user?session.user.id:null;
  if(S.uid&&S.uid!==before&&swReg&&S.push.supported)swReg.pushManager.getSubscription().then(function(sub){if(sub)saveSub(sub);}).catch(function(){});
  S.provider=session&&session.user&&session.user.app_metadata?session.user.app_metadata.provider||'':'';
  if(!S.uid){S.profile=null;S.pf=null;S.mine=null;S.myIds={};S.myCoach=null;S.lessons=null;S.payout=null;}
}
function cleanUrl(){
  try{
    if(/(access_token|refresh_token|error_description)=/.test(location.hash))history.replaceState(null,'',location.pathname+'#discover');
    else if(/[?&](code|error|error_description)=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
  }catch(e){}
}
route();
pushInit();
if(!configured||!window.supabase){render();return;}
try{fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/settings',{headers:{apikey:CONFIG.SUPABASE_ANON_KEY}}).then(function(r){return r.ok?r.json():null;}).then(function(st){if(st&&st.external){S.providers=st.external;render();}}).catch(function(){});}catch(e){}
if(/[?&]error_description=/.test(location.search)){toast('Sign-in didn’t finish. Try again.');}
// Implicit flow: an emailed sign-in link works in whichever browser opens it.
sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sb.auth.onAuthStateChange(function(evt,session){
  setTimeout(function(){
    var wasIn=!!S.uid;setSession(session);S.authReady=true;
    if(evt==='SIGNED_IN'&&!wasIn){
      cleanUrl();S.login={step:'choose',email:'',code:'',error:'',busy:false};
      var next=popNext();
      if(next||S.route==='login')location.hash=next||'discover';
      toast('Signed in. Welcome to Bounce.');
    }
    refreshAll();
  },0);
});
sb.auth.getSession().then(function(r){setSession(r.data&&r.data.session);S.authReady=true;cleanUrl();refreshAll();handleReturn();});
function onLive(kind){return function(){scheduleRefresh(kind);};}
sb.channel('bounce-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'games'},onLive('games'))
  .on('postgres_changes',{event:'*',schema:'public',table:'game_players'},onLive('games'))
  .on('postgres_changes',{event:'*',schema:'public',table:'waitlist'},onLive('games'))
  .on('postgres_changes',{event:'*',schema:'public',table:'messages'},function(m){var gid=m&&m.new&&m.new.game_id;scheduleRefresh(!gid||gid===S.gameId?'chat':'inbox');})
  .on('postgres_changes',{event:'*',schema:'public',table:'club_messages'},onLive('inbox'))
  .on('postgres_changes',{event:'*',schema:'public',table:'clubs'},onLive('clubs'))
  .on('postgres_changes',{event:'*',schema:'public',table:'club_members'},onLive('clubs'))
  .on('postgres_changes',{event:'*',schema:'public',table:'club_posts'},onLive('feed'))
  .on('postgres_changes',{event:'*',schema:'public',table:'post_comments'},onLive('feed'))
  .subscribe();
})();
</script>
