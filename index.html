/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayKey(off){var d=new Date();d.setDate(d.getDate()+(off||0));return keyOf(d);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTime(d){var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'pm':'am';h=h%12||12;return m?h+':'+pad(m)+ap:h+ap;}
function fmtDay(d){var k=keyOf(d);if(k===dayKey(0))return 'Today';if(k===dayKey(1))return 'Tomorrow';return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
/* Founding Organisers: badge, featured games until the end of launch month */
var FEATURED_UNTIL=Date.parse('2027-01-01T00:00:00+11:00');
var STAR='<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
function foundingBadge(small,club){return '<span class="founding-badge'+(small?' sm':'')+'" title="One of the first organisers on Bounce Up">'+STAR+(club?'Founding club':'Founding Organiser')+'</span>';}
function isFeatured(g){return g.founding&&Date.now()<FEATURED_UNTIL&&isUpcoming(g);}
function adminFoundingCard(kind,id,on){
  return '<section class="card admin-card" aria-label="Admin"><div class="switch-row"><div><b>'+(kind==='club'?'Founding club':'Founding Organiser')+'</b><p>Admin only. Shows the badge and features their games at the top of Discover until the end of launch month.</p></div>'+
    '<button type="button" class="switch" role="switch" aria-label="Founding '+(kind==='club'?'club':'Organiser')+'" aria-checked="'+(!!on)+'" data-act="'+(kind==='club'?'admin-club-founding':'admin-founding')+'" data-id="'+esc(id)+'"'+(S.busy?' disabled':'')+'><i></i></button></div></section>';
}
function setFounding(kind,id){
  if(!S.isAdmin||S.busy)return;
  var on=kind==='club'?!(S.club&&S.club.founding):!(S.player&&S.player.founding);
  S.busy=true;render();
  sb.rpc(kind==='club'?'set_club_founding':'set_founding',kind==='club'?{p_club:id,p_on:on}:{p_user:id,p_on:on}).then(function(r){
    S.busy=false;
    if(r.error){toast(friendlyError(r.error,'Couldn’t change the Founding badge. Try again.'));render();return;}
    toast(on?(kind==='club'?'Founding club badge given':'Founding Organiser badge given'):'Badge removed');
    if(kind==='club'){S.club=null;S.clubState='loading';}else{S.player=null;S.playerState='loading';}
    refreshAll();
  });
}
/* Organiser checks: people who run paid sessions or coach show their ABN, insurance, venue papers,
   coaching accreditation and Working with Children Check, and the admin approves them.
   Everything here stays hidden until the database has the organiser checks update. */
var CHECKS=false;
function ckCols(){return CHECKS?', organiser_until, coach_until':'';}
function probeChecks(){
  if(!sb||CHECKS)return;
  sb.from('profiles').select('organiser_until').limit(1).then(function(r){if(r&&!r.error)enableChecks();},function(){});
}
function enableChecks(){
  if(CHECKS)return;CHECKS=true;
  GAME_SELECT=GAME_SELECT.replace('host:profiles!games_host_id_fkey(founding)','host:profiles!games_host_id_fkey(founding, organiser_until, coach_until)');
  COACH_SELECT=COACH_SELECT.replace('dupr_doubles)','dupr_doubles, coach_until)');
  refreshAll();
}
function untilOk(d){return !!d&&String(d).slice(0,10)>=dayKey(0);}
function untilOn(d,ymd){return !!d&&String(d).slice(0,10)>=String(ymd||dayKey(0));}
function ymdLabel(v){var p=String(v||'').slice(0,10).split('-');return p.length===3?Number(p[2])+' '+MON[Number(p[1])-1]+' '+p[0]:'';}
function myOrgOn(ymd){var p=S.profile||{};return CHECKS&&(untilOn(p.organiser_until,ymd)||untilOn(p.coach_until,ymd));}
function myCoachOn(ymd){var p=S.profile||{};return CHECKS&&untilOn(p.coach_until,ymd);}
var SHIELD='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="m8.8 12.2 2.2 2.2 4.4-4.6"/></svg>';
function checkedBadge(small,coach,until){return '<span class="checked-badge'+(small?' sm':'')+'" title="'+esc((coach?'Coaching accreditation, insurance and Working with Children Check checked':'ABN, insurance and venue checked')+(until?' until '+ymdLabel(until):''))+'">'+SHIELD+(coach?'Checked coach':'Checked organiser')+'</span>';}
function personChecks(p,small){
  if(!CHECKS||!p)return '';
  var co=untilOk(p.coach_until),og=untilOk(p.organiser_until);
  if(co&&og)return '<span class="checked-badge'+(small?' sm':'')+'" title="Checked as an organiser and a coach">'+SHIELD+'Checked organiser and coach</span>';
  return co?checkedBadge(small,true,p.coach_until):og?checkedBadge(small,false,p.organiser_until):'';
}
var DOW_LONG=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function everyDay(d){return 'every '+DOW_LONG[d.getDay()];}
function seriesErrorText(e){
  e=String(e||'');
  if(/CLUB_PAYOUTS_NOT_READY/.test(e))return 'the club’s payouts aren’t set up';
  if(/PAYOUTS_NOT_READY/.test(e))return 'your payouts aren’t set up';
  if(/CLINIC_NEEDS_COACH/.test(e))return 'your coach profile is switched off';
  if(/CLINIC_NEEDS_CHECK/.test(e))return 'your coach check has run out';
  if(/PAID_NEEDS_CHECK/.test(e))return 'your organiser check has run out';
  if(/NOT_CLUB_ADMIN/.test(e))return 'you’re no longer on the club committee';
  return 'something went wrong';
}
function shortDow(d){var k=keyOf(d);if(k===dayKey(0))return 'Today';if(k===dayKey(1))return 'Tmrw';return DOW[d.getDay()];}
function endOf(g){return new Date(g.start.getTime()+g.durationMin*60000);}
function isUpcoming(g){return endOf(g).getTime()>Date.now();}
function priceLabel(g){return g.price>0?dollars(g.price):'Free';}
function spotsLeft(g,count){return Math.max(0,g.capacity-(count==null?g.count:count));}
function place(g,sep){return [g.venue,g.suburb].filter(Boolean).join(sep||' · ');}
function startsLabel(g){
  var mins=Math.round((g.start.getTime()-Date.now())/60000);
  if(mins<=0)return 'On now';
  if(mins<60)return 'Starts in '+mins+' min';
  if(mins<180)return 'Starts in '+Math.floor(mins/60)+'h '+(mins%60)+'m';
  return fmtDay(g.start)+' · '+fmtTime(g.start);
}

  if(m.indexOf('GAME_NOT_FOUND')>=0)return 'That game isn’t there anymore.';
  if(m.indexOf('SPOT_OPEN')>=0)return 'A spot just opened up. Tap I’m in to grab it.';
  if(m.indexOf('ALREADY_IN')>=0)return 'You’re already in this game.';
  if(m.indexOf('LAST_ADMIN')>=0)return 'A club needs at least one committee member. Make someone else committee first, or close the club.';
  if(m.indexOf('CLUB_PAYOUTS_NOT_READY')>=0)return 'Set up club payouts before club games can take payments.';
  if(m.indexOf('NOT_CLUB_ADMIN')>=0)return 'Only the club committee can send payments to the club.';
  if(m.indexOf('CLUB_HAS_PAID_GAMES')>=0)return 'Players have paid for upcoming club games. Cancel those games first so they’re refunded.';
  if(m.indexOf('PAYOUTS_NOT_READY')>=0)return 'Set up payouts before asking players to pay in the app.';
  if(m.indexOf('PAYMENT_REQUIRED')>=0)return 'This game takes payment when you join.';
  if(m.indexOf('HAS_PAYMENTS')>=0)return 'Players have already paid, so the price can’t change.';
  if(m.indexOf('CLINIC_NEEDS_COACH')>=0)return 'Only coaches can post a clinic. List yourself as a coach first.';
  if(m.indexOf('CLINIC_NEEDS_CHECK')>=0)return 'Clinics need a coach check that lasts until the day of the clinic. Get checked from your profile.';
  if(m.indexOf('PAID_NEEDS_CHECK')>=0)return 'Paid sessions need an organiser check that lasts until the day of the game. Get checked from your profile, or choose Covers costs.';
  if(m.indexOf('COACH_NOT_CHECKED')>=0)return 'This coach hasn’t finished their coach check yet, so they can’t take lesson requests.';
  if(/duplicate key/i.test(m))return 'That’s already done.';
  if(/violates check constraint/i.test(m))return 'Something in the form isn’t valid. Check the fields and try again.';
  if(/fetch|network/i.test(m))return 'You seem to be offline. Check your connection and try again.';
  return fallback;
}

    '<button type="button" class="btn btn-line search-done only-phone" data-act="search-close">Done</button>'+
    '<button type="button" class="btn btn-line filters-btn only-xs" data-act="filters" aria-haspopup="dialog" aria-label="Filters'+(nf?', '+nf+' on':'')+'">'+I.sliders+'<span aria-hidden="true">Filters</span>'+(nf?'<b aria-hidden="true">'+nf+'</b>':'')+'</button></div>';
  h+=exploreStrip();
  var calView=S.dview==='cal';
  h+='<div class="filters not-xs"><div class="scroller" role="group" aria-label="Sport">'+sportChips('sport',S.sport)+'</div>'+(calView?'':'<div class="scroller" role="group" aria-label="Day">'+dayButtons()+'</div>')+'</div>';
  var label=S.day==='all'||calView?'Coming up':S.day==='soon'?'Starting in the next 3 hours':fmtDay(new Date(S.day+'T00:00'));
  h+='<div class="list-head"><h2>'+esc(calView?'Calendar':label)+(calView||!S.loaded?'':' <span class="meta">'+list.length+(list.length===1?' game':' games')+'</span>')+'</h2>'+viewToggle('dview',S.dview)+'</div>';
  if(!S.loaded&&!S.loadError)h+=loader('Finding games near you…');

  else if(!list.length){
    if(S.day==='soon'&&up.length)h+='<div class="empty"><strong>Nothing starting in the next 3 hours</strong><p>Try Any day, or turn on notifications in your profile so we ping you when a game nearby is one short.</p>'+
      '<button type="button" class="btn btn-line" data-act="day" data-v="all">Show any day</button></div>';
    else h+='<div class="empty"><strong>'+(up.length?'No games match':'No games posted yet')+'</strong><p>'+(up.length?'Try another sport or day, or post your own game and let people find you.':'Be the first. Post a game you already play and share the invite with your group.')+'</p>'+
      (up.length&&nf?'<button type="button" class="btn btn-line" data-act="filters-clear">Clear filters</button>':'')+'<a class="btn btn-accent" href="#host">Host a game</a></div>';
    if(nearClubs.length)h+=clubsStrip(nearClubs,'only-narrow');
  } else {
    // Clubs near you comes after the 3rd game on phones (4th on tablets, to keep both columns full), so games come first.
    h+='<div class="list">';var last='',n=0;
    list.forEach(function(g){
      var dk=keyOf(g.start);if(S.day==='all'&&dk!==last){h+='<div class="group-label">'+esc(fmtDay(g.start))+'</div>';last=dk;}
      h+=cardHTML(g);n++;
      if(nearClubs.length&&n===3)h+=clubsStrip(nearClubs,'only-phone');

    });

  }
  h+='</div>'+discoverRail(alerts,nearClubs)+'</div>';

}

function hostSummary(i){

  if(i===0)return [SPORT_LABEL[f.sport],f.level,f.title.trim()].filter(Boolean).join(' · ');
  if(i===1){var d=new Date(f.date+'T'+f.time),n=Math.round(Number(f.need));return [isNaN(d.getTime())?'':fmtDay(d)+' '+fmtTime(d),durLabel(f.duration),n>0?'need '+n+(f.hostPlays?' + you':''):'',f.weekly?'weekly':''].filter(Boolean).join(' · ');}

function hostErrors(){
  var f=S.form,need=Math.round(Number(f.need)),cap=formCapacity(f),price=toPrice(f.price),start=new Date(f.date+'T'+f.time);
  if(f.title.trim().length<3)return [0,'Give your game a name, like “Social doubles”.'];
  if(!f.date||!f.time||isNaN(start.getTime()))return [1,'Pick a date and start time.'];
  if(start.getTime()<Date.now())return [1,'That time has already passed. Pick a later one.'];
  if(!(need>=1))return [1,'Add how many players you’re looking for.'];
  if(cap>50)return [1,'A game can have up to 50 players.'];
  if(!f.venue.trim())return [2,'Add the venue so players know where to go.'];
  if(!f.suburb.trim())return [2,'Add the suburb.'];
  if(!subPicked(f))return [2,'Pick the suburb from the list, so players nearby get the alert.'];
  if(f.sport==='pickleball'&&((f.duprMin!==''&&duprNum(f.duprMin)==null)||(f.duprMax!==''&&duprNum(f.duprMax)==null)))return [0,'DUPR ratings go from 2.0 to 8.0.'];
  if(f.sport==='pickleball'&&duprNum(f.duprMin)!=null&&duprNum(f.duprMax)!=null&&duprNum(f.duprMin)>duprNum(f.duprMax))return [0,'The lower DUPR is above the upper one.'];
  if(!(price>=0&&price<=500))return [3,'Cost must be between $0 and $500.'];
  if(CHECKS&&f.clinic&&S.myCoach&&!myCoachOn(f.date))return [0,'Clinics need a coach check that lasts until the day of the clinic. Get checked from your profile first.'];
  if(CHECKS&&price>0&&f.paid&&!(f.clinic&&S.myCoach)&&!myOrgOn(f.date))return [3,'Paid sessions need an organiser check first. Choose “Covers costs”, or get checked from your profile.'];
  return null;
}

function timeAgo(d){
  var s=Math.round((Date.now()-d.getTime())/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<172800)return 'yesterday';if(s<604800)return Math.floor(s/86400)+' days ago';
  return d.getDate()+' '+MON[d.getMonth()];
}

var MONTHS_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function viewToggle(act,cur){

/* key: which calendar (discover, mine, club). games: what to show. opts.allowPast lets the month go backwards. */
function calendarHTML(key,games,opts){
  opts=opts||{};
  var now=new Date(),st=S.cal[key];
  if(!st)st=S.cal[key]={m:monthKey(now),d:null};
  var y=Number(st.m.slice(0,4)),mo=Number(st.m.slice(5,7))-1,first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate();
  var lead=(first.getDay()+6)%7,todayK=dayKey(0),thisMonth=monthKey(now);
  var byDay={};games.forEach(function(g){var k=keyOf(g.start);(byDay[k]=byDay[k]||[]).push(g);});
  var monthCount=0;Object.keys(byDay).forEach(function(k){if(k.slice(0,7)===st.m)monthCount+=byDay[k].length;});
  var canPrev=opts.allowPast||st.m>thisMonth;
  var h='<section class="cal" aria-label="Calendar"><div class="cal-head">'+
    '<button type="button" class="cal-nav" data-act="cal-month" data-v="'+key+'|-1"'+(canPrev?'':' disabled')+' aria-label="Previous month">‹</button>'+

function duprTxt(n){return n==null?'':Number(n).toFixed(n*100%1?3:2).replace(/0$/,'');}
function duprRange(a,b){a=duprNum(a);b=duprNum(b);if(a==null&&b==null)return '';return 'DUPR '+(a!=null&&b!=null?duprTxt(a)+'–'+duprTxt(b):a!=null?duprTxt(a)+'+':'up to '+duprTxt(b));}

function loadVenue(){
  if(S.route!=='venue'||!S.venueId)return Promise.resolve();
  var id=S.venueId,since=new Date(Date.now()-6*3600*1000).toISOString();
  return Promise.all([
    sb.from('venues').select('*').eq('id',id).maybeSingle(),
    sb.from('games').select(GAME_SELECT).eq('venue_id',id).gte('starts_at',since).order('starts_at').limit(50),
    S.leagues===null?loadLeagues():Promise.resolve()
  ]).then(function(res){

  S.leagueEntries.forEach(function(e){t[e.id]={id:e.id,name:entryName(e.id),captain:e.captain_id,p:0,w:0,l:0,d:0,f:0,a:0,pts:0};});
  S.leagueMatches.forEach(function(m){
    if(m.score_a==null||!t[m.entry_a]||!t[m.entry_b])return;
    var A=t[m.entry_a],B=t[m.entry_b];A.p++;B.p++;A.f+=m.score_a;A.a+=m.score_b;B.f+=m.score_b;B.a+=m.score_a;
    if(m.score_a>m.score_b){A.w++;B.l++;A.pts+=2;}else if(m.score_b>m.score_a){B.w++;A.l++;B.pts+=2;}else{A.d++;B.d++;A.pts++;B.pts++;}
  });
  return Object.keys(t).map(function(k){return t[k];}).sort(function(a,b){return b.pts-a.pts||(b.f-b.a)-(a.f-a.a)||b.f-a.f||a.name.localeCompare(b.name);});
}
/* Round robin: the circle method; with an odd number one entry sits out each round */
function roundRobin(ids){
  var list=ids.slice();if(list.length%2)list.push(null);
  var n=list.length,out=[];
  for(var r=0;r<n-1;r++){
    for(var i=0;i<n/2;i++){var a=list[i],b=list[n-1-i];if(a&&b)out.push({round:r+1,entry_a:r%2?b:a,entry_b:r%2?a:b});}
    list.splice(1,0,list.pop());
  }
  return out;
}

function refreshLeague(){Promise.all([loadLeague(),loadLeagues()]).catch(function(){}).then(render);}
function setLeagueStatus(status){
  var l=S.league;if(!l)return;

  var start=status==='running'&&l.status==='open'&&l.format==='round_robin'&&!S.leagueMatches.length;

  p.then(function(r){

  }).then(function(r){

    toast(status==='running'?(start?'Fixtures made. Players can enter scores now.':'League started'):status==='finished'?'League finished':'League reopened');refreshLeague();

function saveScore(id){

  S.busy=true;

    S.busy=false;

/* ---------- Safety: 18+ check, block, report, delete my account, community rules ---------- */
var CONTACT_EMAIL='benjibajout@gmail.com';
var REPORTS=false; // turns on by itself once the reports table is live (Gael's database update)
var ADULT=18,AGE_BLOCK_KEY='bu-age-block',AGE_BLOCK_DAYS=30,MAX_BLOCKED=50;
function userMeta(){var u=S.session&&S.session.user;return (u&&u.user_metadata)||{};}
function needsAge(){return !!S.uid&&!!S.session&&!userMeta().adult_confirmed_at;}
function ageFrom(d,m,y){
  d=parseInt(d,10);m=parseInt(m,10);y=parseInt(y,10);
  var now=new Date();
  if(!(y>=1900&&y<=now.getFullYear()&&m>=1&&m<=12&&d>=1&&d<=31))return null;
  var b=new Date(y,m-1,d);
  if(b.getFullYear()!==y||b.getMonth()!==m-1||b.getDate()!==d||b>now)return null;
  var a=now.getFullYear()-y;
  if(now.getMonth()<m-1||(now.getMonth()===m-1&&now.getDate()<d))a--;
  return a;
}
function ageBlocked(){try{var t=Number(localStorage.getItem(AGE_BLOCK_KEY)||0);return !!t&&Date.now()-t<AGE_BLOCK_DAYS*864e5;}catch(e){return false;}}
function setAgeBlock(){try{localStorage.setItem(AGE_BLOCK_KEY,String(Date.now()));}catch(e){}}
function dobFields(pre,v){
  v=v||{};

  return '<fieldset class="dob"><legend>Date of birth</legend><div class="dob-row">'+box('d','Day','DD','bday-day',2)+box('m','Month','MM','bday-month',2)+box('y','Year','YYYY','bday-year',4)+'</div>'+
    '<span class="hint">Bounce Up is for people 18 and over. We only keep a note that you are, not your birthday.</span></fieldset>';
}
function under18Card(signedIn){
  return '<div class="card age-stop"><h2>Bounce Up is for people 18 and over</h2><p>Sorry, you need to be 18 or older to use Bounce Up. Come back when you turn 18.</p>'+
    '<p class="meta">Entered the wrong date? Email <a href="mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent('Bounce Up age check')+'">'+CONTACT_EMAIL+'</a>.</p>'+
    (signedIn?'<button type="button" class="btn btn-line" data-act="age-signout">Sign out</button>':'<button type="button" class="btn btn-line" data-act="login-back">Back</button>')+'</div>';

function viewAgeGate(){
  var A=S.age||(S.age={d:'',m:'',y:'',error:'',busy:false});

    '<form class="stack" id="age-form" novalidate>'+dobFields('age',A)+(A.error?'<p class="err" role="alert">'+esc(A.error)+'</p>':'')+

    '<p class="meta age-links"><a href="#rules">Community rules</a> · <a href="terms.html" target="_blank" rel="noopener">Terms</a> · <button type="button" class="link-btn" data-act="age-signout">Sign out</button></p></div>';
  return h+'</section>';

/* Saves to the person's own account record; merges locally so the screen updates straight away */
function saveMeta(patch){
  return sb.auth.updateUser({data:patch}).then(function(r){
    if(r.error)return r;
    var u=S.session&&S.session.user;
    if(u){var back=(r.data&&r.data.user&&r.data.user.user_metadata)||{};u.user_metadata=Object.assign({},u.user_metadata||{},back,patch);}
    return r;
  });
}
function submitAge(){
  var A=S.age;if(!A||A.busy)return;
  var a=ageFrom(A.d,A.m,A.y);
  if(a==null){A.error='Check your date of birth. For example 07 / 03 / 1990.';render();return;}
  A.busy=true;A.error='';render();
  if(a<ADULT){
    setAgeBlock();
    // Tell the team, so the account gets closed (once the reports table is live)
    if(REPORTS)sb.from('reports').insert({reporter_id:S.uid,kind:'person',target_id:S.uid,target_user:S.uid,target_label:((S.profile&&S.profile.display_name)||'New player').slice(0,120),reason:'underage',details:'Said they are under 18 at the age check. Close this account.'}).then(function(){},function(){});
    saveMeta({under_18:true}).then(function(){A.busy=false;render();});
    return;
  }
  saveMeta({adult_confirmed_at:new Date().toISOString()}).then(function(r){
    A.busy=false;
    if(r.error){A.error='That didn’t save. Check your connection and try again.';render();return;}
    S.age=null;toast('Thanks. You’re all set.');render();
  });
}

/* ---------- Block: hides that person's games, posts, comments and messages from you ---------- */
function blockedIds(){var b=userMeta().blocked;return Array.isArray(b)?b.filter(function(x){return typeof x==='string'&&ID_RE.test(x);}):[];}
function isBlocked(id){return !!id&&!!S.uid&&String(id)!==S.uid&&blockedIds().indexOf(String(id))>=0;}
function setBlocked(id,on,name,quiet){
  if(!S.uid||!id||id===S.uid)return Promise.resolve(false);
  var list=blockedIds().filter(function(x){return x!==id;});
  if(on)list.unshift(id);
  if(list.length>MAX_BLOCKED){toast('You can block up to '+MAX_BLOCKED+' people. Unblock someone first.');return Promise.resolve(false);}
  S.blockBusy=true;render();
  return saveMeta({blocked:list}).then(function(r){
    S.blockBusy=false;
    if(r.error){toast('Couldn’t save that. Try again.');render();return false;}
    if(!quiet)toast(on?(name||'They')+' is blocked':(name||'They')+' is unblocked');
    if(S.blockedPeople)S.blockedPeople=S.blockedPeople.filter(function(p){return blockedIds().indexOf(p.id)>=0;});
    render();return true;
  });
}
function loadBlockedPeople(){
  var ids=blockedIds();
  if(!S.uid||!ids.length){S.blockedPeople=[];return Promise.resolve();}
  return sb.from('profiles').select('id, display_name, avatar_url').in('id',ids).then(function(r){
    var byId={};((r&&!r.error&&r.data)||[]).forEach(function(p){byId[p.id]=p;});
    S.blockedPeople=ids.map(function(id){return byId[id]||{id:id,display_name:null,avatar_url:null};});
  });
}
function blockedCard(){
  var ids=blockedIds();if(!ids.length)return '';
  var list=S.blockedPeople;
  if(!list||list.length!==ids.length){if(!S.blockedLoading){S.blockedLoading=true;loadBlockedPeople().then(function(){S.blockedLoading=false;render();},function(){S.blockedLoading=false;});}}
  var h='<section class="card"><div class="list-head"><h2>People you blocked</h2><span class="meta">'+ids.length+'</span></div><p class="meta">You don’t see their games, posts, comments or chat messages. They aren’t told.</p><div>';
  h+=(list||[]).map(function(p){var nm=p.display_name||'Bounce Up player';
    return '<div class="member-row"><a href="#p-'+esc(p.id)+'">'+avatar(p.id,p.display_name,p.avatar_url,36)+'<span>'+esc(nm)+'</span></a><button type="button" class="btn btn-line btn-sm" data-act="unblock" data-id="'+esc(p.id)+'"'+(S.blockBusy?' disabled':'')+'>Unblock</button></div>';}).join('');
  return h+'</div></section>';
}
function personName(id){
  if(S.player&&S.player.id===id)return S.player.display_name||'This player';
  var pools=(S.players||[]).concat(S.waiting||[],S.clubMembers||[],S.messages||[],(S.clubChat&&S.clubChat.messages)||[]);
  for(var i=0;i<pools.length;i++){var p=pools[i];if(p.user_id===id&&p.profile&&p.profile.display_name)return p.profile.display_name;}
  var b=(S.blockedPeople||[]).filter(function(p){return p.id===id;})[0];

function safetyRow(p){

    '<p class="safety-row"><button type="button" class="link-btn" data-act="report" data-v="person" data-id="'+esc(p.id)+'">Report '+esc(nm)+'</button></p>';

/* ---------- Report ---------- */
var REPORT_REASONS=[['harassment','Harassment or bullying'],['hate','Hate or discrimination'],['sexual','Sexual or inappropriate'],['scam','Scam, fake or spam'],['unsafe','Unsafe at a game'],['underage','Under 18'],['other','Something else']];
var REPORT_KIND={person:'person',game:'game',club:'club',post:'post'};
function reasonLabel(k){var r=REPORT_REASONS.filter(function(x){return x[0]===k;})[0];return r?r[1]:k;}
function reportTarget(kind,id){
  var base=location.origin+location.pathname;
  if(kind==='person')return {label:personName(id),user:id,link:base+'#p-'+id,title:'Report '+personName(id)};
  if(kind==='game'){var g=lookupGame(id)||(S.game&&S.game.id===id?S.game:null);return {label:g?g.title:'Game',user:g?g.hostId:null,link:base+'#g-'+id,title:'Report this game'};}
  if(kind==='club'){var c=S.club&&S.club.id===id?S.club:null;return {label:c?c.name:'Club',user:null,link:base+'#c-'+id,title:'Report this club'};}
  if(kind==='post'){var p=findPost(id);return {label:p?'Post in '+p.club.name:'Club post',user:p?p.authorId:null,link:base+(p?'#c-'+p.clubId:''),clubId:p?p.clubId:null,title:'Report this post'};}
  return null;
}
function openReport(kind,id){
  if(!REPORT_KIND[kind]||needLogin(currentHash()))return;
  var t=reportTarget(kind,id);if(!t)return;
  openSheet({type:'report',kind:kind,id:id,label:t.label,user:t.user,link:t.link,clubId:t.clubId||null,title:t.title,reason:'',details:'',block:false,step:'form',busy:false,error:''});
}
function reportText(R){
  var me=(S.profile&&S.profile.display_name)||'A Bounce Up player';
  return 'Reason: '+reasonLabel(R.reason)+'\nAbout: '+R.kind+' "'+R.label+'"\nLink: '+R.link+(R.user?'\nTheir account: '+R.user:'')+
    '\n\nWhat happened:\n'+(R.details.trim()||'(nothing added)')+'\n\nReported by: '+me+' ('+S.uid+')';
}
function reportMailto(R){
  return 'mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent('Bounce Up report: '+reasonLabel(R.reason)+' – '+R.label)+'&body='+encodeURIComponent(reportText(R));
}
function openMail(href){try{window.location.href=href;}catch(e){}}
function sendReport(){
  var R=S.sheet;if(!R||R.type!=='report'||R.busy)return;
  if(!R.reason){R.error='Pick what’s wrong first.';render();return;}
  var after=function(){if(R.block&&R.kind==='person'&&R.user&&!isBlocked(R.user))setBlocked(R.user,true,R.label,true);};
  if(!REPORTS){R.step='email';R.error='';after();render();openMail(reportMailto(R));return;}
  R.busy=true;R.error='';render();
  var target=R.kind==='post'&&R.clubId?R.clubId+'/'+R.id:String(R.id);
  sb.from('reports').insert({reporter_id:S.uid,kind:R.kind,target_id:target,target_user:R.user||null,target_label:String(R.label||'').slice(0,120),reason:R.reason,details:R.details.trim().slice(0,1000)||null}).then(function(r){
    R.busy=false;
    if(r.error){R.error=/REPORT_LIMIT/.test(r.error.message||'')?'You’ve sent a lot of reports today. Email '+CONTACT_EMAIL+' instead.':'That didn’t send. Check your connection and try again.';render();return;}
    R.step='sent';after();render();
  });
}
function copyReport(){
  var R=S.sheet;if(!R||R.type!=='report')return;
  var txt='To: '+CONTACT_EMAIL+'\n\n'+reportText(R);
  try{navigator.clipboard.writeText(txt).then(function(){toast('Report copied. Paste it into an email to '+CONTACT_EMAIL+'.');},function(){toast('Couldn’t copy. Email '+CONTACT_EMAIL+'.');});}catch(e){toast('Couldn’t copy. Email '+CONTACT_EMAIL+'.');}
}
function reportSheet(R){
  var h='<div class="sheet-head"><div><h2 id="sheet-title">'+esc(R.step==='form'?R.title:R.step==='email'?'Almost done':'Thanks for telling us')+'</h2>'+(R.step==='form'&&R.kind==='person'?'':'<p class="meta">'+esc(R.label)+'</p>')+'</div></div>';
  if(R.step==='sent')return h+'<p>We’ll look at it and act if it breaks our <a href="#rules" data-act="sheet-close">community rules</a>. The person isn’t told who reported them.</p>'+
    (R.block?'<p class="meta">'+esc(R.label)+' is blocked too.</p>':'')+'<p class="safety-note">Someone in danger? Call <b>000</b>.</p><div class="sheet-foot"><button type="button" class="btn btn-brand" data-act="sheet-close">Done</button></div>';
  if(R.step==='email')return h+'<p>Your email app should open with the report written. Tap <b>Send</b>.</p>'+
    '<div class="sheet-menu"><a class="btn btn-brand" href="'+esc(reportMailto(R))+'">'+RI.mail+'Open email</a><button type="button" class="btn btn-line" data-act="rp-copy">Copy report</button></div>'+
    '<p class="meta">No email app? Copy the report and send it to <b>'+CONTACT_EMAIL+'</b>. The person isn’t told who reported them.</p>'+(R.block?'<p class="meta">'+esc(R.label)+' is blocked.</p>':'')+
    '<div class="sheet-foot"><button type="button" class="btn btn-line" data-act="sheet-close">Done</button></div>';
  h+='<p class="meta">Reports are private. The person isn’t told who reported them.</p>';
  h+='<div class="field"><span class="lbl" id="rp-why">What’s wrong?</span><div class="reasons" role="radiogroup" aria-labelledby="rp-why">'+REPORT_REASONS.map(function(r){
    return '<button type="button" class="reason" role="radio" data-act="rp-reason" data-v="'+r[0]+'" aria-checked="'+(R.reason===r[0])+'"><i aria-hidden="true"></i>'+esc(r[1])+'</button>';}).join('')+'</div></div>';
  h+='<div class="field"><label for="rp-details">What happened? (optional)</label><textarea id="rp-details" maxlength="1000" placeholder="When it happened, what was said, who was there">'+esc(R.details)+'</textarea></div>';
  if(R.kind==='person'&&R.user&&!isBlocked(R.user))h+='<label class="check-row"><input type="checkbox" id="rp-block"'+(R.block?' checked':'')+'><span>Also block '+esc(R.label)+'</span></label>';
  h+='<p class="safety-note">Someone in danger? Call <b>000</b>. Read our <a href="#rules" data-act="sheet-close">community rules</a>.</p>';
  if(R.error)h+='<p class="err" role="alert">'+esc(R.error)+'</p>';
  return h+'<div class="sheet-foot"><button type="button" class="btn btn-brand" data-act="rp-send"'+(R.busy?' disabled':'')+'>'+(R.busy?'Sending…':'Send report')+'</button><button type="button" class="btn btn-line" data-act="sheet-close">Cancel</button></div>';
}
function blockSheet(B){

    '<ul class="plain-list"><li>You won’t see their games in Discover, or their posts, comments and chat messages.</li><li>They aren’t told, and they can still see games you’re both in.</li><li>You can unblock them any time from their profile or yours.</li></ul>'+
    '<div class="sheet-foot"><button type="button" class="btn btn-danger" data-act="block-yes" data-id="'+esc(B.id)+'"'+(S.blockBusy?' disabled':'')+'>Block</button><button type="button" class="btn btn-line" data-act="sheet-close">Cancel</button></div>';
}
function safetySheet(sh){
  if(sh.type==='report')return reportSheet(sh);
  if(sh.type==='block')return blockSheet(sh);
  return '';

function deleteCard(){
  var D=S.del,h='<section class="card delete-card" aria-labelledby="del-h"><h2 id="del-h">Delete my account</h2>'+
    '<p class="meta">Removes your profile, photo, messages, comments, club memberships and game spots. Payment records are kept for 5 years without your name, because tax law requires it.</p>';
  if(!D)return h+'<button type="button" class="btn btn-line self-start" data-act="del-acct">Delete my account</button></section>';
  if(D.step==='blocked'){
    var why={hosting:['You’re hosting ',' and people have joined. Delete the game, or ask them to leave first.','#g-'],paid:['You paid for ','. Leave the game first so you get your refund.','#g-'],club:['You’re the only committee member of ','. Make someone else committee first, or close the club.','#c-'],league:['You run the league ','. Finish it first.','#l-']};
    return h+'<div class="confirm"><b>First, sort these out:</b><ul class="plain-list">'+(D.blockers||[]).map(function(b){var w=why[b.kind]||['',' needs sorting out first.',''];var link=w[2]&&ID_RE.test(String(b.id))?'<a href="'+w[2]+esc(b.id)+'">'+esc(b.name||'this')+'</a>':esc(b.name||'this');return '<li>'+w[0]+link+w[1]+'</li>';}).join('')+'</ul>'+
      '<div class="actions"><button type="button" class="btn btn-line" data-act="del-acct-no">OK</button></div></div></section>';
  }
  if(D.step==='email'){
    return h+'<div class="confirm"><b>Send us the request</b><p class="meta">Your email app should open with the request written. Tap Send and we’ll delete your account within 30 days.</p>'+
      '<div class="actions"><a class="btn btn-brand" href="'+esc(deleteMailto())+'">'+RI.mail+'Open email</a><button type="button" class="btn btn-line" data-act="del-acct-no">Close</button></div>'+
      '<p class="meta">No email app? Email <b>'+CONTACT_EMAIL+'</b> from the address you sign in with, and ask us to delete your account.</p></div></section>';
  }
  var ok=String(D.word||'').trim().toUpperCase()==='DELETE';
  return h+'<div class="confirm"><b>Delete your account for good?</b><p class="meta">This can’t be undone.</p>'+
    '<div class="field"><label for="del-word">Type DELETE to confirm</label><input id="del-word" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" value="'+esc(D.word||'')+'"></div>'+
    (D.error?'<p class="err" role="alert">'+esc(D.error)+'</p>':'')+
    '<div class="actions"><button type="button" class="btn btn-danger" data-act="del-acct-yes"'+(!ok||D.busy?' disabled':'')+'>'+(D.busy?'Deleting…':'Delete my account')+'</button><button type="button" class="btn btn-line" data-act="del-acct-no">Keep my account</button></div></div></section>';
}
function deleteMailto(){
  var em=(S.session&&S.session.user&&S.session.user.email)||'';
  return 'mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent('Delete my Bounce Up account')+'&body='+encodeURIComponent('Please delete my Bounce Up account.\n\nSign-in email: '+em+'\nAccount id: '+S.uid+'\n\nI understand payment records are kept for 5 years without my name.');
}
function missingFn(e){var c=e&&e.code,m=String((e&&e.message)||'');return c==='PGRST202'||c==='42883'||(e&&e.status===404)||/could not find the function|function .* does not exist/i.test(m);}
function removeMyFiles(){
  var jobs=['avatars','checks'].map(function(b){
    try{var bucket=sb.storage.from(b);
      return bucket.list(S.uid,{limit:100}).then(function(r){var names=((r&&r.data)||[]).map(function(f){return S.uid+'/'+f.name;});return names.length?bucket.remove(names):null;}).catch(function(){});
    }catch(e){return Promise.resolve();}
  });
  return Promise.all(jobs);
}
function deleteAccount(){
  var D=S.del;if(!D||D.busy)return;
  if(String(D.word||'').trim().toUpperCase()!=='DELETE'){D.error='Type DELETE to confirm.';render();return;}
  D.busy=true;D.error='';render();
  function blocked(res){D.busy=false;D.step='blocked';D.blockers=res.blockers||[];render();}
  sb.rpc('delete_my_account',{dry_run:true}).then(function(r){
    if(r.error){
      if(missingFn(r.error)){D.busy=false;D.step='email';render();openMail(deleteMailto());return;}
      throw r.error;
    }
    if(r.data&&r.data.ok===false)return blocked(r.data);
    return removeMyFiles().then(function(){return sb.rpc('delete_my_account',{dry_run:false});}).then(function(r2){
      if(r2.error)throw r2.error;
      if(r2.data&&r2.data.ok===false)return blocked(r2.data);
      S.del=null;
      var done=function(){setSession(null);location.hash='discover';render();toast('Your account is deleted. Thanks for playing.');};
      return forgetDevice().catch(function(){}).then(function(){return sb.auth.signOut();}).then(done,done);
    });
  }).catch(function(){D.busy=false;D.error='That didn’t work. Check your connection and try again.';render();});
}

var STATS_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
var CHECKPOINT_GOAL=10;
function weekStart(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function loadStats(){
  if(!S.isAdmin)return Promise.resolve();
  var from=weekStart(new Date(Date.now()-7*7*86400000));
  return Promise.all([
    sb.from('games').select('id, title, host_id, club_id, series_id, starts_at, duration_min, capacity, created_at, game_players(user_id)').gte('starts_at',from.toISOString()).order('starts_at').limit(3000),
    sb.from('profiles').select('id, created_at').gte('created_at',from.toISOString()).limit(5000),
    sb.from('profiles').select('id',{count:'exact',head:true}),
    sb.from('profiles').select('id',{count:'exact',head:true}).eq('founding',true)
  ]).then(function(r){
    if(r[0].error){S.stats={error:true};return;}
    S.stats={at:new Date(),from:from,games:r[0].data||[],joined:r[1].error?[]:(r[1].data||[]),players:r[2].count||0,founding:r[3].count||0};
  },function(){S.stats={error:true};});
}
function statsWeeks(st){
  var now=Date.now(),weeks=[];
  for(var i=0;i<8;i++){var s=new Date(st.from);s.setDate(s.getDate()+7*i);var e=new Date(s);e.setDate(e.getDate()+7);weeks.push({start:s,end:e,games:0,played:0,filled:0,offered:0,hosts:{},joined:0});}
  function wk(t){for(var i=0;i<weeks.length;i++)if(t>=weeks[i].start.getTime()&&t<weeks[i].end.getTime())return weeks[i];return null;}
  st.games.forEach(function(g){
    var t=new Date(g.starts_at).getTime(),w=wk(t);if(!w)return;
    var cap=Math.max(1,Number(g.capacity)||1),gp=Array.isArray(g.game_players)?g.game_players:[],n=gp.length&&gp[0]&&gp[0].user_id!==undefined?gp.length:((gp[0]&&gp[0].count)||0);
    w.games++;w.hosts[g.host_id]=1;
    if(t<=now){w.played++;w.filled+=Math.min(n,cap);w.offered+=cap;}
  });
  st.joined.forEach(function(p){var w=wk(new Date(p.created_at).getTime());if(w)w.joined++;});
  weeks.forEach(function(w){w.organisers=Object.keys(w.hosts).length;w.full=w.offered?Math.round(100*w.filled/w.offered):null;});
  return weeks;
}
function weeklyHosts(st){
  var now=Date.now(),h={};
  st.games.forEach(function(g){if(g.series_id&&new Date(g.starts_at).getTime()+(Number(g.duration_min)||60)*60000>now)h[g.host_id]=1;});
  return Object.keys(h).length;
}

function viewStats(){

    weeks.slice().reverse().map(function(w,i){return '<tr'+(i===0?' class="now"':'')+'><th scope="row">'+esc(w.start.getDate()+' '+MON[w.start.getMonth()])+(i===0?' (this week)':'')+'</th><td>'+w.games+'</td><td>'+(w.full==null?'–':w.full+'%')+'</td><td>'+w.organisers+'</td><td>'+w.joined+'</td><td>'+w.firsts+'</td><td>'+(w.ret==null?'–':w.ret+'% ('+w.kept+')')+'</td></tr>';}).join('')+
    '</tbody></table></div><p class="meta">How full = spots taken ÷ spots offered, for games already played. First game = players whose first game in these 8 weeks was that week; Back in week 4 = how many of them played again 4 weeks later. Updated '+esc(fmtTime(st.at))+'.</p></section>';
  return h;

/* ---------- Partners: who to check this week, Join the club, Your month ---------- */
var DAY_MS=86400000;
function playersOf(g){var gp=Array.isArray(g.game_players)?g.game_players:[];return gp.length&&gp[0]&&gp[0].user_id!==undefined?gp.map(function(p){return p&&p.user_id;}).filter(Boolean):[];}
function countOf(g){var gp=Array.isArray(g.game_players)?g.game_players:[];return gp.length&&gp[0]&&gp[0].user_id!==undefined?gp.length:((gp[0]&&gp[0].count)||0);}
function fillOf(g){var cap=Math.max(1,Number(g.capacity)||1);return Math.min(countOf(g),cap)/cap;}
function daysAgo(t){var d=Math.floor((Date.now()-t)/DAY_MS);return d<=0?'today':d===1?'yesterday':d+' days ago';}

/* Admin numbers page: organisers to check this week */
function partnerWatch(st){
  var now=Date.now(),by={};
  st.games.forEach(function(g){
    var t=new Date(g.starts_at).getTime(),h=g.host_id;if(!h||isNaN(t))return;
    var x=by[h]||(by[h]={id:String(h),first:t,last:null,next:null,clubId:null,series:{}});
    if(t<x.first)x.first=t;
    if(g.club_id)x.clubId=String(g.club_id);
    if(t<=now){
      if(x.last==null||t>x.last)x.last=t;
      if(g.series_id){var s=x.series[g.series_id]||(x.series[g.series_id]={title:String(g.title||'Weekly game'),runs:[]});s.runs.push({t:t,full:fillOf(g)});}
    } else if(x.next==null||t<x.next)x.next=t;
  });
  var quiet=[],low=[],fresh=[];
  Object.keys(by).forEach(function(k){
    var x=by[k];
    if(x.next==null&&x.last!=null&&now-x.last>=14*DAY_MS)quiet.push(x);
    Object.keys(x.series).forEach(function(sid){
      var s=x.series[sid];s.runs.sort(function(a,b){return b.t-a.t;});
      if(s.runs.length>=2&&s.runs[0].full<0.5&&s.runs[1].full<0.5)low.push({x:x,title:s.title,now:s.runs[0].full,before:s.runs[1].full});
    });
    if(now-x.first<30*DAY_MS)fresh.push(x);
  });
  quiet.sort(function(a,b){return b.last-a.last;});
  fresh.sort(function(a,b){return a.first-b.first;});
  return {quiet:quiet.slice(0,12),low:low.slice(0,12),fresh:fresh.slice(0,20)};
}
function ensurePartnerNames(w){

function joinOffer(){
  if(!S.uid||!S.mine||!S.myClubs)return null;

    if(!g.clubId||g.hostId===S.uid||g.start.getTime()<cut)return;

function clubNameOf(id){

/* "Your month": a shareable, printable report for organisers and coaches, club committees and (admin) venues */
function monthStartOf(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(1);return x;}
function addMonths(d,k){var x=new Date(d);x.setMonth(x.getMonth()+k);return x;}
function defaultMonth(){var n=new Date(),m=monthStartOf(n);if(n.getDate()<=7)m.setMonth(m.getMonth()-1);return m;}
function monthScope(){
  var m=/^month-([cvp])-([A-Za-z0-9-]{1,60})$/.exec(S.monthHash||'');
  if(!m)return {kind:'p',id:S.uid,self:true};
  return {kind:m[1],id:m[2],self:m[1]==='p'&&m[2]===S.uid};
}
function monthAllowed(sc){
  if(!S.uid||!sc.id)return false;
  if(sc.self||S.isAdmin)return true;
  return sc.kind==='c'&&isClubAdmin(sc.id);
}
function loadMonth(sc,ms,key){
  var end=addMonths(ms,1),back=addMonths(ms,-6);
  var q=sb.from('games').select('id, title, sport, kind, starts_at, capacity, series_id, game_players(user_id)');
  q=sc.kind==='c'?q.eq('club_id',sc.id):sc.kind==='v'?q.eq('venue_id',sc.id):q.eq('host_id',sc.id);
  var who=sc.kind==='c'?sb.from('clubs').select('id, name, logo_url').eq('id',sc.id).maybeSingle()
    :sc.kind==='v'?sb.from('venues').select('id, name, suburb').eq('id',sc.id).maybeSingle()
    :sb.from('profiles').select('id, display_name, avatar_url').eq('id',sc.id).maybeSingle();
  S.month={key:key,state:'loading'};
  return Promise.all([q.gte('starts_at',back.toISOString()).lt('starts_at',end.toISOString()).order('starts_at').limit(2000),who]).then(function(r){
    if(!S.month||S.month.key!==key)return;
    if(r[0].error){S.month={key:key,state:'error'};return;}
    var w=(r[1]&&r[1].data)||{};
    S.month={key:key,state:'ready',rows:r[0].data||[],name:String(w.name||w.display_name||''),logo:w.logo_url||'',avatar:w.avatar_url||''};
  },function(){if(S.month&&S.month.key===key)S.month={key:key,state:'error'};});
}
function partOfDay(d){var h=d.getHours();return h<12?'morning':h<17?'afternoon':'evening';}
function monthNumbers(rows,ms){
  var a=ms.getTime(),b=addMonths(ms,1).getTime(),now=Date.now(),prior={},players={},groups={},slots={};
  var o={played:0,upcoming:0,filled:0,offered:0,players:0,newFaces:0,again:0};
  rows.forEach(function(g){
    var t=new Date(g.starts_at).getTime(),ids=playersOf(g);if(isNaN(t))return;
    if(t<a){ids.forEach(function(u){prior[u]=1;});return;}
    if(t>=b)return;
    if(t>now){o.upcoming++;return;}
    var cap=Math.max(1,Number(g.capacity)||1),n=Math.min(ids.length,cap),d=new Date(t);
    o.played++;o.filled+=n;o.offered+=cap;
    ids.forEach(function(u){players[u]=(players[u]||0)+1;});
    var gk=g.series_id?'s'+g.series_id:'t'+String(g.title||'').trim().toLowerCase();
    var gr=groups[gk]||(groups[gk]={title:String(g.title||'Game'),clinic:g.kind==='clinic',games:0,filled:0,offered:0});
    gr.games++;gr.filled+=n;gr.offered+=cap;
    var sk=d.getDay()+'-'+partOfDay(d),sl=slots[sk]||(slots[sk]={day:d.getDay(),part:partOfDay(d),games:0,filled:0,offered:0});
    sl.games++;sl.filled+=n;sl.offered+=cap;
  });
  Object.keys(players).forEach(function(u){o.players++;if(!prior[u])o.newFaces++;if(players[u]>1)o.again++;});
  o.full=o.offered?Math.round(100*o.filled/o.offered):null;
  o.groups=Object.keys(groups).map(function(k){return groups[k];}).sort(function(x,y){return y.games-x.games||y.filled-x.filled;});
  o.slots=Object.keys(slots).map(function(k){return slots[k];}).sort(function(x,y){return y.filled-x.filled||y.games-x.games;});
  return o;
}
function pct(f,o){return o?Math.round(100*f/o)+'%':'–';}
function monthBar(ms){
  var canNext=addMonths(ms,1).getTime()<=monthStartOf(new Date()).getTime();
  return '<div class="month-bar no-print" role="group" aria-label="Choose a month"><button type="button" class="btn btn-line btn-sm" data-act="month-prev" aria-label="Previous month">‹</button>'+
    '<b>'+esc(MONTHS_LONG[ms.getMonth()]+' '+ms.getFullYear())+'</b>'+
    '<button type="button" class="btn btn-line btn-sm" data-act="month-next" aria-label="Next month"'+(canNext?'':' disabled')+'>›</button></div>';
}

  S.monthView={name:name,label:label+(thisMonth?' so far':''),cur:cur,kind:sc.kind};

  var h=back+monthBar(ms)+'<article class="month-sheet"><header class="month-top"><span class="month-kicker">Bounce Up · '+esc(kicker)+'</span>'+
    '<div class="month-who">'+face+'<div class="gbody"><h1>'+esc(name)+'</h1><p class="meta">'+esc(label+(thisMonth?' so far':''))+'</p></div></div><p class="month-lead">'+esc(lead)+'</p></header>';
  if(!cur.played&&!cur.upcoming){
    h+='<div class="empty"><strong>No games '+(thisMonth?'yet this month':'in '+esc(label))+'</strong><p>'+(sc.kind==='v'?'Games posted at this venue show up here.':'Post a weekly game and this report fills itself in.')+'</p>'+(sc.self?'<a class="btn btn-accent no-print" href="#host">Host a game</a>':'')+'</div>';
    return h+'</article>';
  }
  function delta(a,b,unit){if(!prev.played)return '';var d=a-b;return d===0?'Same as '+pl:(d>0?'+':'−')+Math.abs(d)+(unit||'')+' vs '+pl;}
  h+='<div class="stats month-stats">'+
    statTile('Games played',String(cur.played),cur.upcoming?cur.upcoming+' more coming up this month':'',delta(cur.played,prev.played))+
    statTile('Spots filled',String(cur.filled),'of '+cur.offered+' offered','')+
    statTile('How full',cur.full==null?'–':cur.full+'%',sc.kind==='v'?'Spots taken in games here':'Target 70%',cur.full!=null&&prev.full!=null?delta(cur.full,prev.full,' points'):'')+
    statTile('Players',String(cur.players),'Different people who played',delta(cur.players,prev.players))+
    statTile('New faces',String(cur.newFaces),sc.kind==='v'?'First game here in 6 months':'First game with '+(sc.self?'you':'them')+' in 6 months','')+
    statTile('Came back',String(cur.again),'Played more than once this month','')+
    '</div>';
  var notes=[];
  if(cur.full!=null)notes.push(sc.kind==='v'?'Games here were '+cur.full+'% full.':cur.full>=70?'Games were '+cur.full+'% full, above the 70% target.':'Games were '+cur.full+'% full. The target is 70%: try One Short alerts, another time, or opening a session to newcomers.');
  if(cur.newFaces)notes.push(cur.newFaces+(cur.newFaces===1?' new face':' new faces')+' tried '+(sc.kind==='v'?'these courts':sc.self?'your games':'these games')+(cur.again?', and '+cur.again+(cur.again===1?' player':' players')+' came back more than once':'')+'.');
  if(cur.slots[0])notes.push('Busiest time: '+DOW_LONG[cur.slots[0].day]+' '+cur.slots[0].part+'.');

  if(cur.groups.length)h+='<section class="stack-sm"><h2>'+(sc.kind==='v'?'Games at these courts':'The games')+'</h2><div class="table-wrap"><table class="stats-table month-table"><thead><tr><th scope="col">Game</th><th scope="col">Played</th><th scope="col">Spots</th><th scope="col">How full</th></tr></thead><tbody>'+
    cur.groups.slice(0,8).map(function(g){return '<tr><th scope="row">'+esc(g.title)+(g.clinic?' <span class="meta">(clinic)</span>':'')+'</th><td>'+g.games+'</td><td>'+g.filled+' of '+g.offered+'</td><td>'+pct(g.filled,g.offered)+'</td></tr>';}).join('')+
    '</tbody></table></div></section>';
  if(cur.slots.length>1)h+='<section class="stack-sm"><h2>When people played</h2><div class="table-wrap"><table class="stats-table month-table"><thead><tr><th scope="col">Day and time</th><th scope="col">Games</th><th scope="col">Spots</th><th scope="col">How full</th></tr></thead><tbody>'+
    cur.slots.slice(0,6).map(function(s){return '<tr><th scope="row">'+esc(DOW_LONG[s.day]+' '+s.part)+'</th><td>'+s.games+'</td><td>'+s.filled+' of '+s.offered+'</td><td>'+pct(s.filled,s.offered)+'</td></tr>';}).join('')+
    '</tbody></table></div></section>';
  h+='<p class="month-foot">Numbers only, no names, so it’s safe to share. Each player is counted once, by their account. Made with Bounce Up · bounceup.app</p></article>';

}
function shareMonth(){
  var v=S.monthView;if(!v)return;

  if(navigator.share)navigator.share({title:v.name+' · '+v.label,text:text,url:url}).catch(function(e){if(!e||e.name!=='AbortError')copy();});

function clickPartners(a,id){

  if(a==='lesson-offer-no'){dismissJoin(String(id));toast('Okay. We won’t suggest it for a while.');render();return true;}
  if(a==='month-prev'){S.monthAt=addMonths(S.monthAt||defaultMonth(),-1);render();return true;}
  if(a==='month-next'){var n=addMonths(S.monthAt||defaultMonth(),1);if(n.getTime()<=monthStartOf(new Date()).getTime()){S.monthAt=n;render();}return true;}

/* QR codes: the library loads only when a QR is first shown */
var QR_SRC='https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js',QR={state:'idle',cache:{}};
function loadQR(){
  if(QR.state!=='idle')return;QR.state='loading';
  var s=document.createElement('script');s.src=QR_SRC;s.async=true;
  s.onload=function(){QR.state=typeof window.qrcode==='function'?'ready':'error';render();};
  s.onerror=function(){QR.state='error';render();};
  document.head.appendChild(s);
}
function qrSVG(text){
  if(QR.cache[text])return QR.cache[text];
  var q=window.qrcode(0,'M');q.addData(text);q.make();
  var n=q.getModuleCount(),d='';
  for(var r=0;r<n;r++){var c=0;while(c<n){if(q.isDark(r,c)){var s=c;while(c<n&&q.isDark(r,c))c++;d+='M'+s+' '+r+'h'+(c-s)+'v1h-'+(c-s)+'z';}else c++;}}
  var svg='<svg class="qr-svg" viewBox="-4 -4 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges" role="img" aria-label="@L@"><rect x="-4" y="-4" width="'+(n+8)+'" height="'+(n+8)+'" fill="#FFFFFF"/><path fill="#13261E" d="'+d+'"/></svg>';
  QR.cache[text]=svg;return svg;
}
function qrBlock(text,label){
  if(typeof window.qrcode==='function'){try{QR.state='ready';return qrSVG(text).replace('@L@',esc(label));}catch(e){return '<p class="meta qr-fail">'+esc(text)+'</p>';}}
  if(QR.state==='error')return '<p class="meta qr-fail">Couldn’t load the QR code. Check your connection and try again.</p>';
  loadQR();return '<div class="qr-wait" role="status" aria-label="Loading QR code"></div>';
}

/* #s-<series id> opens the next game of a weekly series (what weekly posters point to) */

  sb.from('games').select('id, starts_at, duration_min').eq('series_id',id).gte('starts_at',new Date(Date.now()-6*3600000).toISOString()).order('starts_at').limit(6).then(function(r){
    if(S.route!=='series'||S.seriesId!==id)return;
    var now=Date.now(),hit=(r.data||[]).filter(function(x){return x&&x.id&&new Date(x.starts_at).getTime()+(Number(x.duration_min)||90)*60000>now;})[0];
    if(hit&&ID_RE.test(String(hit.id))){location.replace('#g-'+hit.id);return;}
    S.seriesState=r.error?'error':'none';render();
  },function(){if(S.route==='series'){S.seriesState='error';render();}});
}
function viewSeries(){
  if(S.seriesState==='none')return '<div class="empty"><strong>No game coming up in this series</strong><p>The organiser may have paused it. Have a look at other games near you.</p><a class="btn btn-accent" href="#discover">Find a game</a></div>';
  if(S.seriesState==='error')return '<div class="empty"><strong>Couldn’t open this game</strong><p>Check your connection and try again.</p><a class="btn btn-line" href="#discover">Find a game</a></div>';
  return loader('Opening the next game…');
}
/* Admin numbers: players who played with more than one organiser (word of mouth working) */
function crossPlayers(st){
  var now=Date.now(),by={};
  st.games.forEach(function(g){var t=new Date(g.starts_at).getTime();if(isNaN(t)||t>now||!g.host_id)return;playersOf(g).forEach(function(u){if(u===g.host_id)return;var x=by[u]||(by[u]={});x[g.host_id]=1;});});
  var all=Object.keys(by),multi=all.filter(function(u){return Object.keys(by[u]).length>=2;}).length;
  return {all:all.length,multi:multi,pct:all.length?Math.round(100*multi/all.length):null};
}
function crossTile(st){
  var c=crossPlayers(st);
  return statTile('Played with 2+ organisers',c.pct==null?'–':c.pct+'%',c.pct==null?'Shows once players have played':c.multi+' of '+c.all+' players in the last 8 weeks. Word of mouth at work','');
}
function clickDemo(a){
  if(a==='demo-step'){var d=demoState(),v=arguments[1];demoStop(d);if(v==='next'&&d.step<DEMO_STEPS.length-1)d.step++;else if(v==='back'&&d.step>0)d.step--;d.phase=0;S.resetScroll=true;render();return true;}
  if(a==='demo-reset'){demoStop(S.demo);S.demo=null;demoState();S.resetScroll=true;render();return true;}
  if(a==='demo-drop'){
    var d2=demoState();demoStop(d2);d2.phase=1;render();
    d2.t1=setTimeout(function(){if(S.demo!==d2||d2.step!==2||S.route!=='demo')return;d2.phase=2;render();},1600);
    d2.t2=setTimeout(function(){if(S.demo!==d2||d2.step!==2||S.route!=='demo')return;d2.phase=3;render();},3600);
    return true;
  }
  if(a==='demo-copy'){buCopy(location.origin+location.pathname+'#host','Link copied');return true;}
  if(a==='poster-print'){window.print();return true;}
  if(a==='poster-copy'){if(S.game)buCopy(posterURL(S.game),'Link copied');return true;}
  if(a==='promo-copy'){var pv=arguments[1];if(S.game){var pm=promoMessages(S.game).filter(function(x){return x.k===pv;})[0];if(pm)buCopy(pm.x,pm.k==='facebook'?'Copied. Paste it in the Facebook group.':pm.k==='venue'?'Copied. Send it to the venue.':'Copied. Paste it in your group chat.');}return true;}
  return false;
}
function fieldDemo(e){

function myPlayed(){
  // Games I was in (or hosted) that have started, newest first
  var now=Date.now();
  return (S.mine||[]).filter(function(g){return g.start.getTime()<=now;}).sort(byStart).reverse();
}
/* The next game in the same weekly series, or the same host's next game at the same place and sport */
function nextAfter(g){
  if(!g)return null;
  var pool=(S.games||[]).concat(S.mine||[]),best=null,limit=g.start.getTime()+16*86400000;
  pool.forEach(function(x){
    if(x.id===g.id||!isUpcoming(x)||x.start<=g.start)return;
    var same=(g.seriesId&&x.seriesId===g.seriesId)||(!g.seriesId&&x.hostId===g.hostId&&x.sport===g.sport&&x.venue&&x.venue===g.venue&&x.start.getTime()<=limit);
    if(same&&(!best||x.start<best.start))best=x;
  });
  return best;
}
function inGame(x){return !!(S.myIds[x.id]||S.waitIds[x.id]||(S.uid&&x.hostId===S.uid));}
function playAgainOffers(max){
  if(!S.uid||!S.mine)return [];
  var seen={},out=[],cut=Date.now()-21*86400000;
  myPlayed().forEach(function(g){
    if(out.length>=(max||3)||g.start.getTime()<cut||g.hostId===S.uid)return;
    var nx=nextAfter(g);
    if(nx&&!seen[nx.id]&&!inGame(nx)&&!isBlocked(nx.hostId)){seen[nx.id]=1;out.push({from:g,next:nx});}
  });
  return out;
}
function againCard(o){
  var g=o.next,left=spotsLeft(g);
  return '<div class="again"><span class="again-ico" aria-hidden="true">'+AGAIN_ICON+'</span><div class="gbody"><small>Play again</small><a href="#g-'+esc(g.id)+'"><b>'+esc(g.title)+'</b></a>'+
    '<span class="meta">'+esc(fmtDay(g.start)+', '+fmtTime(g.start)+' · '+place(g))+(left>0?' · '+left+(left===1?' spot left':' spots left'):' · full, waitlist open')+'</span></div>'+
    '<button type="button" class="btn btn-accent btn-sm" data-act="'+(left>0?'join':'wait-join')+'" data-id="'+esc(g.id)+'"'+(S.busy?' disabled':'')+'>'+(left>0?'I’m in':'Waitlist')+'</button></div>';
}
function playAgainHTML(max){
  var offers=playAgainOffers(max);if(!offers.length)return '';
  return '<section class="stack-sm again-list" aria-label="Play again">'+offers.map(againCard).join('')+'</section>';
}

/* Weeks in a row with at least one game played */
function weekKey(d){var w=weekStart(d);return w.getFullYear()+'-'+pad(w.getMonth()+1)+'-'+pad(w.getDate());}
function myStreak(){
  var played=myPlayed();if(!played.length)return {weeks:0,games:0,thisWeek:false};
  var wk={};played.forEach(function(g){wk[weekKey(g.start)]=1;});
  var cur=weekStart(new Date()),thisWeek=!!wk[weekKey(cur)],d=new Date(cur),n=0;
  if(!thisWeek)d.setDate(d.getDate()-7);
  while(wk[weekKey(d)]){n++;d.setDate(d.getDate()-7);}
  return {weeks:n,games:played.length,thisWeek:thisWeek};
}
function streakHTML(where){
  var s=myStreak();if(!s.games)return '';
  if(s.weeks>=2)return '<p class="streak'+(where==='mine'?' streak-card':'')+'">'+FLAME+'<b>'+s.weeks+' weeks in a row</b>'+(where==='mine'?'<span class="meta">'+(s.thisWeek?'You’ve played this week. See you next week!':'Play this week to keep it going.')+'</span>':'')+'</p>';
  if(where==='profile')return '<p class="streak">'+FLAME+'<b>'+s.games+(s.games===1?' game played':' games played')+'</b></p>';
  return '';
}

/* People you've played with before */
function ensureMates(){
  if(!S.uid||!S.mine)return;
  var ids=myPlayed().slice(0,30).map(function(g){return g.id;}),key=ids.join(',');
  if(S.matesKey===key||S.matesLoading)return;
  if(!ids.length){S.mates={};S.matesKey=key;return;}
  S.matesLoading=true;
  sb.from('game_players').select('user_id, game_id, profile:profiles(id, display_name, avatar_url)').in('game_id',ids).then(function(r){
    S.matesLoading=false;S.matesKey=key;var m={};
    if(!r.error)(r.data||[]).forEach(function(p){if(!p.user_id||p.user_id===S.uid||isBlocked(p.user_id))return;var x=m[p.user_id]||(m[p.user_id]={n:0,profile:p.profile||null,games:{}});if(!x.games[p.game_id]){x.games[p.game_id]=1;x.n++;}});
    S.mates=m;render();
  },function(){S.matesLoading=false;});
}
function firstName(p){return String((p&&p.display_name)||'A player').split(' ')[0];}
function regularsHTML(people){
  if(!S.uid||!S.mates)return '';
  var seen={},list=[];
  people.forEach(function(p){var m=S.mates[p.user_id];if(m&&!seen[p.user_id]){seen[p.user_id]=1;list.push({id:p.user_id,profile:p.profile||m.profile,n:m.n});}});
  if(!list.length)return '';
  list.sort(function(a,b){return b.n-a.n;});
  var names=list.slice(0,2).map(function(x){return '<b>'+esc(firstName(x.profile))+'</b>';}),more=list.length-names.length;
  var text=names.join(names.length===2&&!more?' and ':', ')+(more?' and '+more+(more===1?' other':' others'):'');
  return '<p class="regulars"><span class="reg-faces" aria-hidden="true">'+list.slice(0,3).map(function(x){return avatar(x.id,x.profile&&x.profile.display_name,x.profile&&x.profile.avatar_url,26);}).join('')+'</span><span>'+text+(list.length===1?' has':' have')+' played with you before</span></p>';
}

/* Admin numbers: week-4 retention (players whose first game in these 8 weeks was in week W, still playing in week W+4) */
function retentionByWeek(st,weeks){
  var now=Date.now(),first={},played={};
  st.games.forEach(function(g){
    var t=new Date(g.starts_at).getTime();if(t>now)return;
    var wi=-1;for(var i=0;i<weeks.length;i++)if(t>=weeks[i].start.getTime()&&t<weeks[i].end.getTime()){wi=i;break;}
    if(wi<0)return;
    (Array.isArray(g.game_players)?g.game_players:[]).forEach(function(p){
      if(!p||!p.user_id)return;
      (played[p.user_id]=played[p.user_id]||{})[wi]=1;
      if(first[p.user_id]==null||wi<first[p.user_id])first[p.user_id]=wi;
    });
  });
  weeks.forEach(function(w){w.firsts=0;w.kept=0;w.ret=null;});
  Object.keys(first).forEach(function(u){var w=weeks[first[u]];w.firsts++;if(first[u]+4<=6&&played[u][first[u]+4])w.kept++;});
  weeks.forEach(function(w,i){if(i+4<=6&&w.firsts)w.ret=Math.round(100*w.kept/w.firsts);});
  for(var i=2;i>=0;i--)if(weeks[i].ret!=null)return weeks[i];
  return null;
}

function ckRole(role){
  var r=S.myChecks,p=S.profile||{},until=role==='coach'?p.coach_until:p.organiser_until,st=r?(role==='coach'?r.coach_status:r.organiser_status):'none';
  if(untilOk(until))return {key:'checked',until:until,pending:st==='pending',text:'Checked until '+ymdLabel(until)+(st==='pending'?' · new papers waiting for review':st==='changes'?' · your new papers need a change':'')};
  if(st==='pending')return {key:'pending',text:'Waiting for review'};
  if(st==='changes')return {key:'changes',text:'Needs a change'};
  if(st==='approved')return {key:'expired',text:'Expired. Send your current papers.'};
  return {key:'none',text:'Not started'};
}
function ckSmall(x){return x.key==='checked'||x.key==='expired'?'<small class="meta">'+esc(x.text)+'</small>':'';}
function ckPill(x){return statusPill(x.key==='checked'?'Checked':x.key==='pending'?'Waiting for review':x.key==='changes'?'Needs a change':x.key==='expired'?'Expired':'Not started',x.key==='checked'?'good':x.key==='none'?'muted':'');}
function checksCard(){
  if(!S.uid||!CHECKS)return '';
  var r=S.myChecks,o=ckRole('organiser'),c=ckRole('coach');
  var any=r&&(r.wants_organiser||r.wants_coach||o.key!=='none'||c.key!=='none');
  if(!any)return '<section class="card ck-card"><h2>'+SHIELD+'Run paid sessions or coach?</h2><p class="meta">Show players you’re the real deal. Send your ABN, insurance and papers once, and get a Checked tick on your games and profile. Free games and games that only cover costs don’t need this.</p><a class="btn btn-line self-start" href="#checks">Get checked</a></section>';
  var rows='';
  if(r.wants_organiser||o.key!=='none')rows+='<div class="ck-status"><span>Paid sessions</span>'+ckPill(o)+ckSmall(o)+'</div>';
  if(r.wants_coach||c.key!=='none')rows+='<div class="ck-status"><span>Coaching</span>'+ckPill(c)+ckSmall(c)+'</div>';
  return '<section class="card ck-card"><h2>'+SHIELD+'Organiser check</h2>'+rows+(r.admin_note&&(o.key==='changes'||c.key==='changes'||(r.organiser_status==='changes'||r.coach_status==='changes'))?'<p class="notice">'+esc(r.admin_note)+'</p>':'')+
    '<a class="btn btn-line self-start" href="#checks">'+(o.key==='changes'||c.key==='changes'?'Fix and send again':'See my papers')+'</a></section>';
}

function ckErrors(){
  var c=S.ck,r=S.myChecks||{},today=dayKey(0);
  if(!c.wants_organiser&&!c.wants_coach)return 'Pick what you want to do: run paid sessions, coach, or both.';
  if(!r.abn)return 'Add your ABN and tap Check ABN.';
  if(!c.insurer.trim()||!c.insurance_expires||!c.insurance_file)return 'Add your public liability insurance: the insurer, expiry date and certificate.';
  if(Number(c.insurance_cover)<10000000)return 'Your insurance needs at least A$10 million of cover.';
  if(c.insurance_expires<=today)return 'Your insurance has expired. Add your current certificate.';
  if(c.wants_organiser){
    if(!c.venue_name.trim()||!c.venue_file)return 'Add where you run sessions and upload the booking, permit or letter.';
    if(c.venue_expires&&c.venue_expires<=today)return 'Your venue booking or permit has expired. Add the current one.';
  }
  if(c.wants_coach){
    if(!c.coach_body.trim()||!c.coach_level.trim()||!c.coach_file)return 'Add your coaching accreditation and upload the certificate.';
    if(c.coach_expires&&c.coach_expires<=today)return 'Your coaching accreditation has expired. Add the current one.';
    if(!/^[A-Za-z0-9-]{4,20}$/.test(c.wwcc_number.replace(/\s/g,''))||!c.wwcc_surname.trim()||!c.wwcc_expires)return 'Add your Working with Children Check card number, surname and expiry date.';
    if(c.wwcc_expires<=today)return 'Your Working with Children Check has expired.';
  }
  return '';
}
function ckErrorText(e){
  var m=String((e&&e.message)||'');
  var map={PICK_ROLE:'Pick what you want to do: run paid sessions, coach, or both.',NEEDS_ABN:'Add your ABN and tap Check ABN.',NEEDS_INSURANCE:'Add your public liability insurance: the insurer, expiry date and certificate.',
    INSURANCE_LOW:'Your insurance needs at least A$10 million of cover.',INSURANCE_EXPIRED:'Your insurance has expired. Add your current certificate.',NEEDS_VENUE:'Add where you run sessions and upload the booking, permit or letter.',
    VENUE_EXPIRED:'Your venue booking or permit has expired. Add the current one.',NEEDS_ACCREDITATION:'Add your coaching accreditation and upload the certificate.',ACCREDITATION_EXPIRED:'Your coaching accreditation has expired. Add the current one.',
    NEEDS_WWCC:'Add your Working with Children Check card number, surname and expiry date.',WWCC_EXPIRED:'Your Working with Children Check has expired.',BAD_WWCC:'Check your Working with Children Check card number.',
    BAD_FILE:'One of your files didn’t upload properly. Upload it again.',BAD_DATE:'One of the dates isn’t valid. Check it and try again.'};
  for(var k in map)if(m.indexOf(k)>=0)return map[k];
  return friendlyError(e,'Couldn’t send your papers. Check your connection and try again.');
}
function saveCk(submit){
  if(!S.ck||!S.uid)return Promise.resolve();
  if(submit){var e=ckErrors();S.ckError=e;if(e){render();return Promise.resolve();}S.ckBusy=true;render();}
  return sb.rpc('save_organiser_checks',{p:ckPayload(),p_submit:!!submit}).then(function(r){
    if(submit)S.ckBusy=false;
    if(r.error){if(submit){S.ckError=ckErrorText(r.error);render();}return;}
    if(r.data)S.myChecks=r.data;S.ckDirty=false;
    if(submit){S.ckError='';toast('Sent for checking. You’ll get a notification when it’s done.');S.resetScroll=true;render();loadProfile().then(render);}
  });
}
function uploadCk(k,file){
  if(!file||!S.uid||S.ckUp||!CK_FILES[k])return;
  var pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
  if(!pdf&&!/^image\//.test(file.type||'')){toast('Pick a PDF or a photo.');return;}
  if(file.size>10*1048576){toast('That file is over 10 MB. Try a smaller PDF, or a photo of it.');return;}
  S.ckUp=k;render();
  var prep=pdf?Promise.resolve({blob:file,ext:'pdf',type:'application/pdf'}):shrinkImage(file).then(function(b){return {blob:b,ext:'jpg',type:'image/jpeg'};},function(){
    var t=/^image\/(png|webp|heic|heif)$/.test(file.type)?file.type:'image/jpeg';return {blob:file,ext:t.split('/')[1].replace('jpeg','jpg'),type:t};});
  prep.then(function(x){
    var path=S.uid+'/'+k.replace('_file','')+'-'+Date.now()+'.'+x.ext;
    return sb.storage.from('checks').upload(path,x.blob,{contentType:x.type,upsert:false}).then(function(r){if(r.error)throw r.error;return path;});
  }).then(function(path){
    S.ck[k]=path;S.ckUp=null;S.ckDirty=true;toast('Uploaded');render();saveCk(false);
  },function(e){S.ckUp=null;toast(friendlyError(e,'Couldn’t upload that file. Try again, or try a photo instead.'));render();});
}
function checkAbnCk(){
  if(S.ckAbnBusy)return;
  var v=abnClean(S.ckAbn);
  if(!abnOk(v)){S.ckAbnError='That isn’t a valid ABN. Check the 11 digits.';render();return;}
  S.ckAbnBusy=true;S.ckAbnError='';render();
  sb.functions.invoke('organiser-abn',{body:{action:'check',abn:v}}).then(function(r){
    if(r.error)throw r.error;var d=r.data||{};if(d.ok===false)throw new Error(d.error||'FAILED');return d;
  }).then(function(d){
    S.ckAbnBusy=false;S.ckAbnEdit=false;S.ckAbn='';
    S.myChecks=Object.assign({},S.myChecks||{user_id:S.uid},{abn:v,abn_name:d.abn_name||null,abn_status:d.abn_status||null,abn_lookup:!!d.looked_up});
    toast(d.looked_up?'ABN checked with the ABN register':'ABN saved. We’ll check it by hand.');render();
  }).catch(function(e){
    S.ckAbnBusy=false;var m=String(e&&e.message||'');
    S.ckAbnError={BAD_ABN:'That isn’t a valid ABN. Check the 11 digits.',ABN_NOT_FOUND:'The ABN register has no record of that ABN.',ABN_NOT_ACTIVE:'That ABN is cancelled on the ABN register.',ABR_DOWN:'Couldn’t reach the ABN register. Try again in a minute.'}[m]||'Couldn’t check the ABN right now. Try again later.';
    render();
  });
}
function openPaper(path){
  if(!path)return;
  var w=null;try{w=window.open('about:blank','_blank');if(w)w.opener=null;}catch(e){}
  sb.storage.from('checks').createSignedUrl(path,300).then(function(r){
    var u=r&&r.data&&r.data.signedUrl;
    if(!u){if(w)w.close();toast('Couldn’t open that file. Try again.');return;}
    if(w)w.location.href=u;else location.href=u;
  },function(){if(w)w.close();toast('Couldn’t open that file. Try again.');});
}
function deletePapers(){
  if(!S.uid||S.ckBusy)return;S.ckBusy=true;render();
  var bucket=sb.storage.from('checks');
  bucket.list(S.uid,{limit:100}).then(function(r){
    var names=((r&&r.data)||[]).map(function(f){return S.uid+'/'+f.name;});
    return names.length?bucket.remove(names):null;
  }).catch(function(){}).then(function(){return sb.rpc('delete_organiser_checks');}).then(function(r){
    S.ckBusy=false;S.ckConfirmDel=false;
    if(r&&r.error){toast(friendlyError(r.error,'Couldn’t delete your papers. Try again.'));render();return;}
    S.myChecks=null;S.ck=ckDefaults(null);S.ckDirty=false;toast('Your papers are deleted');loadProfile().then(render);
  });
}

var RET=(function(){
  try{
    var q=new URLSearchParams(location.search),o={pay:q.get('pay'),game:q.get('game'),stripe:q.get('stripe'),club:q.get('club')};
    if(o.pay||o.stripe){
      var h=o.pay&&ID_RE.test(o.game||'')?'#g-'+o.game:o.stripe&&ID_RE.test(o.club||'')?'#b-'+o.club:o.stripe?'#payouts':location.hash;

function handleReturn(){
  var o=RET;RET={};
  if(o.pay==='cancel'){toast('Payment cancelled. You haven’t been charged.');return;}
  if(o.pay==='success'&&ID_RE.test(o.game||'')){
    S.payConfirm=o.game;render();
    var tries=0;
    (function poll(){
      tries++;
      Promise.all([loadGame(),loadGamePayments(),loadMine()]).catch(function(){}).then(function(){
        var inNow=S.gameId===o.game&&S.players.some(function(p){return p.user_id===S.uid;});
        if(inNow){S.payConfirm=null;celebrate();toast('Paid and in. Stripe has emailed your receipt.');render();return;}
        if(tries<15)setTimeout(poll,2000);else{S.payConfirm='slow';render();}
      });
    })();
    return;
  }
  if((o.stripe==='return'||o.stripe==='refresh')&&ID_RE.test(o.club||'')){
    var cid=o.club;
    payInvoke({action:'club_status',club_id:cid}).catch(function(){}).then(loadClubPayouts).then(function(){
      toast(clubPayoutReady(cid)?'Club payouts are on. Club games can take payments now.':o.stripe==='refresh'?'That Stripe link expired. Tap Continue to pick up where you left off.':'Saved. Stripe may need a few more details about the club.');
      return loadClubPayments();
    }).then(render);
    return;
  }
  if(o.stripe==='return'||o.stripe==='refresh'){
    payInvoke({action:'status'}).catch(function(){}).then(loadPayout).then(function(){
      var st=payoutState();
      toast(st==='ready'?'Payouts are on. You can take payments now.':o.stripe==='refresh'?'That Stripe link expired. Tap Continue to pick up where you left off.':'Saved. Stripe may need a few more details.');
      loadHostPayments().then(render);
    });
  }
}

    ABR_DOWN:'Couldn’t reach the ABN register. Try again in a minute.',NOT_CLUB_ADMIN:'Only the committee can change the club’s ABN.'}[m]||'Couldn’t save the ABN. Check your connection and try again.';

/* ---------- Australian suburbs, distance and money ---------- */
var AU_STATES=['ACT','NSW','NT','QLD','SA','TAS','VIC','WA'];
var KM_OPTIONS=[5,10,20,50];
function dollars(n){n=Math.round((Number(n)||0)*100)/100;return '$'+(n%1?n.toFixed(2):String(n));}
function toPrice(v){var s=String(v==null?'':v).trim().replace(/^\$/,'').replace(',','.');if(s==='')return 0;var n=Number(s);return isFinite(n)?Math.round(n*100)/100:NaN;}
function subName(t){return String(t||'').replace(/\s+(ACT|NSW|NT|QLD|SA|TAS|VIC|WA)(\s+\d{4})?\s*$/i,'').replace(/\s+\d{4}\s*$/,'').replace(/\s+/g,' ').trim();}
function subLabel(f){return f&&f.suburb?f.suburb+(f.state?' '+f.state+(f.postcode?' '+f.postcode:''):''):'';}
function subPicked(f){return !!(f&&f.suburb&&String(f.suburb).trim()&&AU_STATES.indexOf(f.state)>=0);}
function subForm(p){return p==='pf'?S.pf:p==='f'?S.form:p==='vn'?S.venueForm:p==='cf'?S.clubForm:null;}
function subInput(p,f,ph){
  return '<span class="sub-pick"><input id="'+p+'-suburb" maxlength="64" autocomplete="off" autocapitalize="words" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="'+p+'-sublist" placeholder="'+esc(ph||'Start typing your suburb')+'" value="'+esc(subLabel(f))+'">'+
    '<span class="sub-list" id="'+p+'-sublist" role="listbox" aria-label="Suburbs" hidden></span></span>';
}
var subTimer=null,subSeq=0;
function subSearch(p,text){
  clearTimeout(subTimer);
  var q=String(text||'').trim(),my=++subSeq;
  if(q.length<2){subShow(p,[],'');return;}
  subTimer=setTimeout(function(){
    var pc=(q.match(/\b(\d{4})\b/)||[])[1],st=((q.match(/\b(ACT|NSW|NT|QLD|SA|TAS|VIC|WA)\b/i)||[])[1]||'').toUpperCase();
    var name=subName(q).toLowerCase().replace(/[^a-z0-9' .-]/g,'').trim();
    if(/^\d+$/.test(name))name='';
    var qy=sb.from('localities').select('name,state,postcode');
    if(pc&&!name)qy=qy.eq('postcode',pc);
    else{if(!name){subShow(p,[],q);return;}qy=qy.like('search',name+'%');if(pc)qy=qy.eq('postcode',pc);}
    if(st)qy=qy.eq('state',st);
    qy.order('search').limit(40).then(function(r){
      if(my!==subSeq)return;
      var home=(S.profile&&S.profile.state)||'',rows=(r.data||[]).slice();
      rows.sort(function(a,b){
        var ea=a.name.toLowerCase()===name?0:1,eb=b.name.toLowerCase()===name?0:1;if(ea!==eb)return ea-eb;
        var ha=a.state===home?0:1,hb=b.state===home?0:1;if(ha!==hb)return ha-hb;
        return a.name.length-b.name.length||a.name.localeCompare(b.name)||String(a.postcode).localeCompare(String(b.postcode));
      });
      subShow(p,rows.slice(0,8),q);
    },function(){if(my===subSeq)subShow(p,[],q);});
  },160);
}
function subShow(p,rows,q){
  S.subPick={p:p,items:rows,hi:0};
  var el=document.getElementById(p+'-sublist'),inp=document.getElementById(p+'-suburb');if(!el)return;
  if(!rows.length){
    var show=!!(q&&q.length>=2);
    el.innerHTML=show?'<span class="sub-none">No suburb found. Check the spelling, or type the postcode.</span>':'';
    el.hidden=!show;if(inp){inp.setAttribute('aria-expanded',String(show));inp.removeAttribute('aria-activedescendant');}
    return;
  }
  el.innerHTML=rows.map(function(r,i){return '<button type="button" role="option" id="'+p+'-opt-'+i+'" data-act="sub-pick" data-v="'+p+'|'+i+'" aria-selected="'+(i===0)+'"><span>'+esc(r.name)+'</span><small>'+esc(r.state+' '+r.postcode)+'</small></button>';}).join('');
  el.hidden=false;if(inp){inp.setAttribute('aria-expanded','true');inp.setAttribute('aria-activedescendant',p+'-opt-0');}
}
function subHide(p){var el=document.getElementById(p+'-sublist'),inp=document.getElementById(p+'-suburb');if(el)el.hidden=true;if(inp){inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant');}}

function fieldAU(e){

/* Distance from the player's home suburb */
function kmBetween(a,b){
  if(!a||!b)return null;var R=6371.0088,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r;
  var h=Math.pow(Math.sin(dl/2),2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.pow(Math.sin(dg/2),2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function homeLoc(){var p=S.profile;return p&&typeof p.area_lat==='number'&&typeof p.area_lng==='number'?[p.area_lat,p.area_lng]:null;}
function locOf(o){if(!o)return null;if(o.lat!=null&&o.lng!=null)return [o.lat,o.lng];if(o.areaLat!=null&&o.areaLng!=null)return [o.areaLat,o.areaLng];return null;}
function kmFromHome(o){return kmBetween(homeLoc(),locOf(o));}
function nearKm(){var k=S.profile&&Number(S.profile.alert_km);return KM_OPTIONS.indexOf(k)>=0?k:10;}
function fmtKm(d){return d==null?'':d<1?'under 1 km':(d<10?d.toFixed(1).replace(/\.0$/,''):String(Math.round(d)))+' km';}
function kmTag(o){var d=kmFromHome(o);return d==null?'':' · '+fmtKm(d);}
function isNear(o){
  var d=kmFromHome(o);if(d!=null)return d<=nearKm();
  var home=homeSuburb();return !!home&&String(o.suburb||'').trim().toLowerCase()===home;
}
function closeness(o){var d=kmFromHome(o);if(d!=null)return d;var home=homeSuburb();return home&&String(o.suburb||'').trim().toLowerCase()===home?0:9999;}
function kmPicker(cur){
  return '<div class="field"><span class="lbl" id="pf-km-l">Near me distance</span><div class="seg2" role="group" aria-labelledby="pf-km-l">'+
    KM_OPTIONS.map(function(k){return '<button type="button" class="chip" data-act="pf-km" data-v="'+k+'" aria-pressed="'+(cur===k)+'">'+k+' km</button>';}).join('')+
    '</div><span class="hint">Near me and One Short alerts cover games within this distance of your suburb.</span></div>';
}

  // Club members land on their feed; everyone else lands on the club directory.

/* Minimal DOM morph: walks old and new trees in step and patches differences in place */
function syncControl(a,b){
  if(a===document.activeElement)return;
  if(a.nodeName==='INPUT'){if(a.type==='checkbox'||a.type==='radio'){if(a.checked!==b.checked)a.checked=b.checked;}else if(a.type!=='file'&&a.value!==b.value)a.value=b.value;}
  else if(a.nodeName==='TEXTAREA'){if(a.value!==b.value)a.value=b.value;}
  else if(a.nodeName==='SELECT'){if(a.value!==b.value)a.value=b.value;}
}
function morphNode(a,b){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  var tag=a.nodeName,i;
  if(!a.isEqualNode(b)){
    for(i=a.attributes.length-1;i>=0;i--){var n=a.attributes[i].name;if(!b.hasAttribute(n))a.removeAttribute(n);}
    for(i=0;i<b.attributes.length;i++){var at=b.attributes[i];if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
    if(tag!=='IFRAME'&&tag!=='TEXTAREA'){
      var kids=Array.prototype.slice.call(b.childNodes);
      for(i=0;i<kids.length;i++){
        var an=a.childNodes[i],bn=kids[i];
        if(!an)a.appendChild(bn);
        else if(an.nodeType===bn.nodeType&&an.nodeName===bn.nodeName&&(an.nodeType!==1||an.id===bn.id))morphNode(an,bn);
        else a.replaceChild(bn,an);
      }
      while(a.childNodes.length>kids.length)a.removeChild(a.lastChild);
    }
  }
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')syncControl(a,b);
}

/* Photos are shrunk on the phone (longest side 1600px, JPEG) before upload, so posting is quick on mobile data */
function shrinkImage(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h,1));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){if(b)resolve(b);else reject(new Error('encode'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('decode'));};
    img.src=url;
  });
}
/* Profile photos and club logos: squared on the phone (photos fill the circle, logos fit whole on white), then uploaded */
var STORAGE_PUBLIC=String(CONFIG.SUPABASE_URL).replace(/\/$/,'')+'/storage/v1/object/public/';
function squareImage(file,size,fit){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth||1,h=img.naturalHeight||1,c=document.createElement('canvas');c.width=c.height=size;
      var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,size,size);
      var sc=fit==='contain'?Math.min(size*0.88/w,size*0.88/h):Math.max(size/w,size/h),dw=w*sc,dh=h*sc;
      x.imageSmoothingQuality='high';x.drawImage(img,(size-dw)/2,(size-dh)/2,dw,dh);URL.revokeObjectURL(url);
      c.toBlob(function(b){if(b)resolve(b);else reject(new Error('encode'));},'image/jpeg',0.86);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('decode'));};
    img.src=url;
  });
}
