/* Live updates: collect what changed for ~300ms, then reload only those parts */
var pending={};
function scheduleRefresh(kind){pending[kind||'all']=1;clearTimeout(refreshTimer);refreshTimer=setTimeout(flushRefresh,300);}
function flushRefresh(){
  var k=pending;pending={};
  if(k.all){refreshAll();return;}
  var jobs=[];
  if(k.games){jobs.push(loadGames(),loadMine());if(S.route==='game')jobs.push(loadGame());if(S.route==='club')jobs.push(loadClub());}
  else if(k.chat&&S.route==='game')jobs.push(loadGame());
  if(k.inbox&&S.route==='clubchat')jobs.push(loadClubChat());

function emailField(L){return '<div class="field"><label for="login-email">Email</label><input id="login-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" value="'+esc(L.email)+'"></div>';}
function pwField(L,label,ac){
  return '<div class="field"><label for="login-password">'+esc(label)+'</label><span class="pw-field"><input id="login-password" type="'+(L.show?'text':'password')+'" autocomplete="'+ac+'" autocapitalize="off" spellcheck="false" maxlength="72" value="'+esc(L.password)+'">'+
    '<button type="button" class="pw-toggle" data-act="pw-show" aria-pressed="'+(!!L.show)+'" aria-label="'+(L.show?'Hide password':'Show password')+'">'+(L.show?'Hide':'Show')+'</button></span></div>';
}
function emailOk(e){return /^\S+@\S+\.\S+$/.test(String(e||'').trim());}
function pwMsg(err){
  var m=String(err&&err.message||'').toLowerCase();
  if(m.indexOf('invalid login')>=0)return 'Email or password is wrong. Forgot it? Tap Forgot password.';
  if(m.indexOf('not confirmed')>=0)return 'Confirm your email first: open the link we emailed when you signed up.';
  if(m.indexOf('already registered')>=0||m.indexOf('already exists')>=0)return 'There’s already an account with that email. Sign in, or tap Forgot password to set a password.';
  if(m.indexOf('password')>=0&&(m.indexOf('weak')>=0||m.indexOf('least')>=0||m.indexOf('short')>=0||m.indexOf('characters')>=0))return 'Choose a stronger password: at least 8 characters.';
  if(m.indexOf('rate')>=0||m.indexOf('too many')>=0||(err&&err.status===429))return 'Too many tries. Wait a minute, then try again.';
  return 'That didn’t work. Check your connection and try again.';
}
function pwSignIn(){
  var L=S.login;L.error='';
  if(!emailOk(L.email)){L.error='Enter your email address.';render();return;}
  if(!L.password){L.error='Enter your password.';render();return;}
  L.busy=true;render();
  sb.auth.signInWithPassword({email:L.email.trim(),password:L.password}).then(function(r){
    L.busy=false;if(r.error){L.error=pwMsg(r.error);render();}else{L.password='';}
  });
}
function pwSignUp(){
  var L=S.login;L.error='';
  if(!emailOk(L.email)){L.error='Enter the email address you use every day.';render();return;}
  if(String(L.password).length<8){L.error='Choose a password of at least 8 characters.';render();return;}
  var dob=L.dob||{},age=ageFrom(dob.d,dob.m,dob.y);
  if(age==null){L.error='Enter your date of birth. For example 07 / 03 / 1990.';render();return;}
  if(age<ADULT){setAgeBlock();L.dob={d:'',m:'',y:''};L.password='';render();return;}
  L.busy=true;render();
  sb.auth.signUp({email:L.email.trim(),password:L.password,options:{emailRedirectTo:location.origin+location.pathname,data:{adult_confirmed_at:new Date().toISOString()}}}).then(function(r){
    L.busy=false;
    if(r.error){L.error=pwMsg(r.error);render();return;}
    L.password='';L.dob={d:'',m:'',y:''};
    if(r.data&&r.data.session)return;
    var u=r.data&&r.data.user;
    if(u&&Array.isArray(u.identities)&&!u.identities.length){L.step='choose';L.mode='password';L.error='There’s already an account with that email. Sign in, or tap Forgot password to set a password.';render();return;}
    L.step='confirm';render();
  });
}
function pwForgot(){
  var L=S.login;L.error='';
  if(!emailOk(L.email)){L.error='Type your email above, then tap Forgot password.';render();var i=document.getElementById('login-email');if(i)i.focus();return;}
  L.busy=true;render();
  sb.auth.resetPasswordForEmail(L.email.trim(),{redirectTo:location.origin+location.pathname}).then(function(r){
    L.busy=false;if(r.error)L.error=pwMsg(r.error);else L.step='reset';render();
  });
}
function pwSave(){
  var L=S.login;L.error='';
  if(String(L.password).length<8){L.error='Choose a password of at least 8 characters.';render();return;}
  L.busy=true;render();
  sb.auth.updateUser({password:L.password}).then(function(r){
    L.busy=false;
    if(r.error){L.error=pwMsg(r.error);render();return;}
    L.password='';L.show=false;L.step='choose';toast('Password saved. Use it to sign in next time.');
    location.hash=popNext()||'discover';
  });
}
function startRecovery(){S.login.step='newpass';S.login.password='';S.login.error='';S.login.busy=false;if(location.hash!=='#login')location.hash='login';else render();}
function oauth(provider){
  S.login.error='';
  sb.auth.signInWithOAuth({provider:provider,options:{redirectTo:location.origin+location.pathname}}).then(function(r){
    if(r.error){S.login.error='That sign-in option isn’t working right now. Try email instead.';render();}
  });
}
function sendCode(){
  var L=S.login;L.error='';
  if(!/^\S+@\S+\.\S+$/.test(L.email.trim())){L.error='Enter the email address you use every day.';render();return;}
  L.busy=true;render();
  sb.auth.signInWithOtp({email:L.email.trim(),options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){
    L.busy=false;
    if(r.error)L.error='Couldn’t send the email. Check the address and try again in a minute.';else{L.step='code';L.code='';}

  });
}
/* Sign in from a copied email link (iPhone Home Screen app, where tapping the link would open Safari instead) */
function linkSignIn(){
  var L=S.login;L.error='';
  var u=null;try{u=new URL(String(L.link||'').trim());}catch(e){}
  var host='';try{host=new URL(CONFIG.SUPABASE_URL).host;}catch(e){}
  var tok=u&&u.searchParams.get('token'),typ=u&&u.searchParams.get('type');
  if(!u||u.host!==host||u.pathname.indexOf('/auth/v1/verify')<0||!tok){L.error='That isn’t the sign-in link. In the email, press and hold Log In, tap Copy Link, then try again.';render();return;}
  L.busy=true;render();
  sb.auth.verifyOtp({token_hash:tok,type:['signup','invite','recovery','email_change','email'].indexOf(typ)>=0?typ:'magiclink'}).then(function(r){
    L.busy=false;
    if(r.error){L.error='That link has expired or was already used. Go back, send a new one, and paste the newest link.';render();}
    else{L.link='';if(typ==='recovery')startRecovery();}
  });
}
function pasteLink(){
  var L=S.login;
  if(!navigator.clipboard||!navigator.clipboard.readText){var i=document.getElementById('login-link');if(i)i.focus();toast('Paste the link into the box below');return;}
  navigator.clipboard.readText().then(function(t){L.link=String(t||'').trim();render();linkSignIn();},function(){var i=document.getElementById('login-link');if(i)i.focus();toast('Paste the link into the box below');});
}
function verifyCode(){
  var L=S.login;L.error='';
  if(L.code.length<6){L.error='Enter the 6-digit code from the email.';render();return;}
  L.busy=true;render();
  sb.auth.verifyOtp({email:L.email.trim(),token:L.code.trim(),type:'email'}).then(function(r){
    L.busy=false;
    if(r.error){L.error='That code didn’t work. Check the latest email, or send a new code.';render();}
  });
}

function focusSearch(){

  if(hq&&hq.offsetParent){hq.focus();hq.select();return;}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){hideHover();if(S.menuOpen){e.preventDefault();S.menuOpen=false;renderMenu();var mbt=document.getElementById('menu-btn');if(mbt)mbt.focus();return;}if(S.sheet){e.preventDefault();closeSheet();}return;}
  if(S.sheet&&S.sheet.type==='photo'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){var pp=findPost(S.sheet.id);if(pp){S.sheet.i=(S.sheet.i+(e.key==='ArrowLeft'?-1:1)+pp.photos.length)%pp.photos.length;renderSheet();}return;}
  if(e.metaKey||e.ctrlKey||e.altKey||e.isComposing||S.sheet)return;
  var t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
  if(e.key==='/'){e.preventDefault();focusSearch();}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();if(S.route!=='host')location.hash='host';}
});
/* Keep "Starts in…" countdowns fresh without re-rendering the page */
setInterval(function(){
  document.querySelectorAll('[data-start]').forEach(function(el){var d=new Date(el.getAttribute('data-start'));if(!isNaN(d.getTime()))el.textContent=countdown(d);});
},30000);

/* ---------- boot ---------- */
function setSession(session){
  var before=S.uid;
  S.session=session||null;
  S.uid=session&&session.user?session.user.id:null;
  if(S.uid&&S.uid!==before&&swReg&&S.push.supported)swReg.pushManager.getSubscription().then(function(sub){if(sub)saveSub(sub);}).catch(function(){});
  S.provider=session&&session.user&&session.user.app_metadata?session.user.app_metadata.provider||'':'';
  if(!S.uid){S.month=null;S.monthView=null;S.pn=null;S.pnKey=null;S.joinNo=null;S.mates=null;S.matesKey=null;S.stats=null;S.reports=null;S.del=null;S.age=null;S.wel=null;S.welDone=false;S.blockedPeople=null;S.reportsProbe=false;S.isAdmin=null;S.myChecks=undefined;S.ck=null;S.review=null;S.profile=null;S.pf=null;S.mine=null;S.myIds={};S.myCoach=null;S.lessons=null;S.payout=null;S.clubPayouts={};}
}
function cleanUrl(){
  try{
    if(/(access_token|refresh_token|error_description)=/.test(location.hash))history.replaceState(null,'',location.pathname+'#discover');
    else if(/[?&](code|error|error_description)=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
  }catch(e){}
}
route();
pushInit();
if(!configured||!window.supabase){render();return;}
try{fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/settings',{headers:{apikey:CONFIG.SUPABASE_ANON_KEY}}).then(function(r){return r.ok?r.json():null;}).then(function(st){if(st&&st.external){S.providers=st.external;render();}}).catch(function(){});}catch(e){}
if(/[?&]error_description=/.test(location.search)){toast('Sign-in didn’t finish. Try again.');}
// Implicit flow: an emailed sign-in link works in whichever browser opens it.
sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sb.auth.onAuthStateChange(function(evt,session){
  setTimeout(function(){
    var wasIn=!!S.uid;setSession(session);S.authReady=true;
    if(evt==='PASSWORD_RECOVERY'){cleanUrl();startRecovery();refreshAll();return;}
    if(evt==='SIGNED_IN'&&!wasIn&&S.login.step!=='newpass'){
      cleanUrl();S.login={step:'choose',mode:'password',email:'',password:'',show:false,code:'',link:'',error:'',busy:false};
      var next=popNext();
      if(next||S.route==='login')location.hash=next||'discover';
      toast('Signed in. Welcome to Bounce Up.');
    }
    refreshAll();
  },0);
});
sb.auth.getSession().then(function(r){setSession(r.data&&r.data.session);S.authReady=true;cleanUrl();refreshAll();handleReturn();});
probeChecks();
function onLive(kind){return function(){scheduleRefresh(kind);};}
sb.channel('bounce-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'games'},onLive('games'))
  .on('postgres_changes',{event:'*',schema:'public',table:'game_players'},onLive('games'))
  .on('postgres_changes',{event:'*',schema:'public',table:'waitlist'},onLive('games'))
  .on('postgres_changes',{event:'*',schema:'public',table:'messages'},function(m){var gid=m&&m.new&&m.new.game_id;scheduleRefresh(!gid||gid===S.gameId?'chat':'inbox');})
  .on('postgres_changes',{event:'*',schema:'public',table:'club_messages'},onLive('inbox'))
  .on('postgres_changes',{event:'*',schema:'public',table:'clubs'},onLive('clubs'))
  .on('postgres_changes',{event:'*',schema:'public',table:'club_members'},onLive('clubs'))
  .on('postgres_changes',{event:'*',schema:'public',table:'club_posts'},onLive('feed'))
  .on('postgres_changes',{event:'*',schema:'public',table:'post_comments'},onLive('feed'))
  .subscribe();
})();
</script>
</body>
