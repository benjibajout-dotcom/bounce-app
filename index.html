<style>
/* Layout: one phone-width app column (side menu on wide screens), header band, scrolling content, tab bar. */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --line:#E3DFD4; --line-strong:#CFCABD;
  --ink:#0F1F1A; --muted:#55615B;
  --brand:#1F5C4A; --on-brand:#F5F3EE; --brand-text:#1F5C4A; --brand-soft:#E2EEE8;
  --accent:#FF8A3D; --on-accent:#1A0E05; --accent-soft:#FFEEDF; --accent-text:#8A3A08;
  --hero-bg:#0F1F1A; --hero-fg:#F5F3EE; --hero-muted:#BCC8C1; --hero-line:#3A4D45;
  --danger:#B42318; --focus:#2563EB; --shadow:0 1px 2px rgba(15,31,26,.06);
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* Spacing and sizing tokens (4px base). --gut and --sec grow at wider breakpoints. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --gut:16px; --sec:20px; --top-h:61px; --tab-h:60px; --bar-h:64px;
  --tap:44px; --btn-h:46px; --chip-h:40px; --r-control:12px; --r-card:16px; --r-band:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1814; --surface:#14241F; --line:#24372F; --line-strong:#364D43;
  --ink:#EEF1EC; --muted:#A3B0A9;
  --brand:#7FC4A8; --on-brand:#0C1814; --brand-text:#8FD3B6; --brand-soft:#1C3229;
  --accent:#FF9A55; --on-accent:#1A0E05; --accent-soft:#3A2416; --accent-text:#FFC59C;
  --hero-bg:#1E3A30; --hero-fg:#F5F3EE; --hero-muted:#B9C9C1; --hero-line:#3F5F53;
  --danger:#FF8A80; --focus:#8AB4FF; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px;line-height:1.2}
p{margin:0}
a{color:var(--brand-text)}
img{max-width:100%}
[hidden]{display:none!important}
code{font-size:.9em;background:var(--brand-soft);padding:1px 5px;border-radius:5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

#app{height:100%;height:100dvh;display:flex;flex-direction:column;margin:0 auto;background:var(--bg)}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:4px;min-height:44px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.035em;color:var(--ink);text-decoration:none}
.top-right{display:flex;align-items:center;gap:10px;min-width:0}
.where{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{display:block;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong);text-decoration:none}

main{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.inner{padding-block:16px 28px;display:flex;flex-direction:column;gap:var(--sec)}

.tabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);font-weight:800}
.tab[aria-current="page"]::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .plus{width:34px;height:30px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.tab .plus svg{width:18px;height:18px}

.btn{min-height:46px;padding:0 18px;border-radius:12px;font:inherit;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-line{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-wide{flex:1}
.btn-icon{width:46px;padding:0}
.btn svg{width:18px;height:18px}
.btn-google{background:#FFFFFF;color:#1F1F1F;border-color:#747775;min-height:52px;font-size:16px}
.howto-steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.btn-apple{background:#000000;color:#FFFFFF;min-height:52px;font-size:16px}
@media (prefers-color-scheme: dark){.btn-apple{background:#FFFFFF;color:#000000}}
.self-start{align-self:flex-start}

.hello{display:flex;flex-direction:column;gap:4px}
.meta{font-size:13px;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day{flex:none;width:58px;min-height:56px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day small{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.day b{font-family:var(--display);font-size:18px}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] small{color:var(--on-brand);opacity:.85}
.day.all{width:auto;padding:0 14px;font-weight:700;font-size:13px}

.alert{background:var(--hero-bg);color:var(--hero-fg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.alert .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{background:var(--accent);color:var(--on-accent);font-weight:800;font-size:11.5px;letter-spacing:.07em;padding:4px 8px;border-radius:6px}
.alert .sub{font-size:13px;color:var(--hero-muted)}
.alert h2{font-size:21px}
.alert .btn-line{border-color:var(--hero-line);color:var(--hero-fg)}
.alert .actions{display:flex;gap:10px}

.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.group-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.list .group-label,.list .list-head{grid-column:1/-1}
.game{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.when{align-self:stretch;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-align:center}
.when small{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.when b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.gbody{min-width:0;display:flex;flex-direction:column;gap:3px}
.sport{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-text);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:5px;border:1px solid var(--line-strong);color:var(--muted)}
.tag-accent{border-color:var(--accent);color:var(--accent-text)}
.gtitle{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.spots{font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--brand-soft);color:var(--brand-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.spots.low{background:var(--accent-soft);color:var(--accent-text)}
.spots.full{background:var(--line);color:var(--muted)}
.price{font-size:13px;font-weight:700}

.empty{border:1.5px dashed var(--line-strong);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}
.notice{display:block;border-radius:14px;padding:12px 14px;background:var(--accent-soft);color:var(--accent-text);font-size:14px;font-weight:600;text-decoration:none}
.skeleton{height:86px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(100deg,var(--surface) 30%,var(--bg) 50%,var(--surface) 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);min-height:44px;align-self:flex-start}
.back svg{width:18px;height:18px}
.band{position:relative;overflow:hidden;background:var(--brand);color:var(--on-brand);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.band .court{position:absolute;right:-30px;top:-20px;width:190px;height:140px;opacity:.18;pointer-events:none}
.band .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.band h1{font-size:27px;position:relative}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;position:relative}
.facts div{display:flex;flex-direction:column;gap:1px;min-width:0}
.facts span{font-size:12px;opacity:.8}
.facts b{font-weight:700;font-size:14.5px}
.hostline{font-size:13.5px;display:flex;align-items:center;gap:8px;position:relative}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta.center{justify-content:center}
.pill{min-height:46px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);font-weight:800}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:4px}
.meter-row{display:flex;flex-direction:column;gap:6px}
.meter-row .meta b{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch-row p{font-size:13px;color:var(--muted)}
.switch{flex:none;width:52px;height:32px;border-radius:16px;border:0;padding:3px;background:var(--line-strong);cursor:pointer;display:flex;align-items:center}
.switch i{width:26px;height:26px;border-radius:50%;background:var(--surface);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--danger)}
.confirm .actions{display:flex;gap:10px;flex-wrap:wrap}

.stack-sm{display:flex;flex-direction:column;gap:12px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 8px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;min-width:0}
.person > span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{position:relative;overflow:hidden;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0F1F1A;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.seat{width:50px;height:50px;border-radius:50%;border:1.5px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700}
.notes{white-space:pre-line;font-size:14.5px}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 0}
.msgs{max-height:380px;min-height:120px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.mine{flex-direction:row-reverse}
.bubble{max-width:78%;background:var(--bg);border-radius:14px 14px 14px 4px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bubble p{overflow-wrap:anywhere;white-space:pre-wrap}
.mine .bubble{background:var(--ink);color:var(--bg);border-radius:14px 14px 4px 14px}
.who{font-size:12px;font-weight:800;color:var(--brand-text)}
.at{font-size:11px;opacity:.7;align-self:flex-end}
.chat-empty{color:var(--muted);font-size:14px;text-align:center;margin:auto 0;padding:16px 14px}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;min-height:46px;border-radius:23px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 16px}
.compose .btn{border-radius:23px}

form.stack,.stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.field textarea{padding:10px 12px;min-height:90px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--accent-soft);color:var(--ink);cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check b{display:block}
.check span{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-weight:700;font-size:14px}
.invite{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:10px}

.profile-head{display:flex;align-items:center;gap:14px}
.wrap-chips{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.login{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.login-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.setup{min-height:100%;justify-content:center}

/* Clubs and player profiles */
.clublogo{flex:none;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#0F1F1A;position:relative;overflow:hidden}
.clublogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.photo-pick{position:relative;display:inline-flex;flex:none;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
.photo-pick.sq{border-radius:18px}
.photo-pick .cam{position:absolute;right:-3px;bottom:-3px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);box-shadow:var(--shadow)}
.photo-pick .cam svg{width:14px;height:14px}
.photo-pick:focus-within{outline:2px solid var(--brand);outline-offset:3px}
.photo-pick.busy{opacity:.55;pointer-events:none}
.photo-pick.busy .cam{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.08)}}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.logo-field{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clubrow{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);min-width:0}
.clubrow .gbody{flex:1}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.clubcard{flex:none;width:148px;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit}
.clubcard b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clubband{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.clubband .row{display:flex;align-items:center;gap:14px}
.clubband .sub{font-size:13px;color:var(--hero-muted)}
.chips-sm{display:flex;flex-wrap:wrap;gap:6px}
.chips-sm span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-text)}
.clubband .chips-sm span{background:rgba(255,255,255,.12);color:var(--hero-fg)}
.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.member-row:last-child{border-bottom:0}
.member-row a{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit;font-weight:600}
.member-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.person{text-decoration:none;color:inherit}
.links{display:flex;flex-wrap:wrap;gap:8px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* Motion and touch feedback */
.inner.enter{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn,.chip,.day,.game,.tab,.switch,.back{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}
.btn:not(:disabled):active,.chip:active,.day:active,.switch:active{transform:scale(.96)}
.game:active{transform:scale(.985)}
@media (hover:hover){
  .btn-accent:not(:disabled):hover{box-shadow:0 4px 14px rgba(255,138,61,.35)}
  .btn-brand:not(:disabled):hover,.btn-line:not(:disabled):hover{box-shadow:0 2px 10px rgba(15,31,26,.12)}
  .chip:hover,.day:hover{border-color:var(--ink)}
  .gwrap:hover .game{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,31,26,.08)}
}
.wordmark:hover svg,.wordmark:active svg{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-7px)}65%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}
.alert.enter{animation:slide-in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes slide-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.flag{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,138,61,.65)}70%,100%{box-shadow:0 0 0 10px rgba(255,138,61,0)}}
.msg.new{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:30;display:flex;align-items:center;justify-content:center}
/* Payments */
.paynote{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13px;color:var(--muted)}
.paynote svg{flex:none;margin-top:1px;color:var(--brand-text)}
.paid-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;font-size:14px}
.howto-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.paylist{padding:4px 14px;gap:0}
.payrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.payrow:last-child{border-bottom:0}
.payrow .gbody{flex:1;min-width:0;display:flex;flex-direction:column}
.payrow .gbody b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.payrow .num{font-variant-numeric:tabular-nums}
.card.payout.ready{border-color:var(--brand-text)}
.card.payout h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice svg{vertical-align:-3px;margin-right:4px}
/* Venues, coaches, leagues */
.search-row .search{flex:1;min-width:0}
.explore{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.xtile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;box-shadow:var(--shadow);min-width:0}
.xtile b{display:block;font-size:15px}
.xtile small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xtile span:last-child{min-width:0}
.xicon{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.xicon svg{width:22px;height:22px}
.xrow{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);min-width:0}
.xrow .gbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.xrow .chips-sm{margin-top:3px}
.xcount{flex:none;font-size:13px;font-weight:800;color:var(--brand-text);background:var(--brand-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.xbadge{flex:none;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 7px}
.xside{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.spill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap;background:var(--brand-soft);color:var(--brand-text)}
.spill-good{background:var(--brand-soft);color:var(--brand-text)}
.spill-new{background:var(--accent-soft);color:var(--accent-text)}
.spill-muted{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.cta > .spill{align-self:center}
.tag-brand{border-color:var(--brand-text);color:var(--brand-text)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.lesson .lesson-top{display:flex;align-items:center;gap:10px}
.lesson .lesson-top .gbody{flex:1;min-width:0;display:flex;flex-direction:column}
.lesson .lesson-top a{color:inherit}
.reply{margin:0;padding:10px 12px;border-radius:12px;background:var(--brand-soft);color:var(--ink);font-size:14.5px}
.seg2{display:flex;gap:8px;flex-wrap:wrap}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
fieldset.dupr{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0}
fieldset.dupr legend{padding:0 6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.standings{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:340px}
.standings th{white-space:nowrap;font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.standings td{text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.standings tr:last-child td{border-bottom:0}
.standings th:nth-child(2),.standings td.nm{text-align:left;width:100%}
.standings td.nm{font-weight:700;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings tr.me td{background:var(--accent-soft)}
.standings tbody tr:first-child td:first-child{color:var(--accent-text);font-weight:800}
.fixtures{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"a s b" "x x x";align-items:center;gap:6px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx.me{background:var(--accent-soft)}
.fx .fa{grid-area:a;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fx .fb{grid-area:b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fx .won{font-weight:800}
.fx .fs{grid-area:s;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:center;color:var(--muted)}
.fx .fs.edit{display:flex;align-items:center;gap:4px;color:var(--ink)}
.fx .fs.edit input{width:52px;min-height:40px;text-align:center;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:800}
.fx .fx-act{grid-area:x;display:flex;gap:8px;justify-content:center}
.side-clubs + .side-clubs{margin-top:12px}
.side-ico{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--brand-soft);color:var(--brand-text)}
.side-ico svg{width:17px;height:17px}
@media (max-width:767px){.explore .xtile{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 6px}.explore .xtile small{display:none}.explore .xtile b{font-size:14px}}
@media (max-width:420px){.row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row3 .field:first-child{grid-column:1/-1}.kv{grid-template-columns:minmax(0,1fr)}}
/* The Bounce ball, in 3D. loop = opening, loading and sign-in; idle = header (one hop every 4s); plain = celebration */
.ballsvg{overflow:visible;flex:none}
.ballsvg .ball,.ballsvg .squash,.ballsvg .face{transform-box:view-box}
.ballsvg .squash{transform-origin:156px 222px}
.ballsvg .face{transform-origin:156px 170px}
.ballsvg .shadow{transform-box:fill-box;transform-origin:center}
.ballsvg .eye{transform-box:fill-box;transform-origin:center;animation:bb-blink 4.2s infinite}
.ballsvg .trail circle{fill:currentColor;opacity:.3}
.ballsvg.plain .shadow{display:none}
.ballsvg.loop .ball{animation:bb-hop 1.15s infinite}
.ballsvg.loop .squash{animation:bb-squash 1.15s infinite}
.ballsvg.loop .shadow{animation:bb-shade 1.15s infinite}
.ballsvg.loop .face{animation:bb-glance 1.15s infinite}
.ballsvg.loop .trail circle{animation:bb-trail 1.15s infinite}
.ballsvg.loop .trail circle:nth-child(1){animation-delay:-.05s}.ballsvg.loop .trail circle:nth-child(2){animation-delay:-.13s}.ballsvg.loop .trail circle:nth-child(3){animation-delay:-.21s}
.ballsvg.loop .trail circle:nth-child(4){animation-delay:-.29s}.ballsvg.loop .trail circle:nth-child(5){animation-delay:-.37s}.ballsvg.loop .trail circle:nth-child(6){animation-delay:-.45s}
.ballsvg.idle .ball{animation:bb-idlehop 4s infinite}
.ballsvg.idle .squash{animation:bb-idlesquash 4s infinite}
.ballsvg.idle .shadow{animation:bb-idleshade 4s infinite}
@keyframes bb-hop{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.22,.72,.32,1)}50%{transform:translateY(-64px);animation-timing-function:cubic-bezier(.62,0,.82,.32)}100%{transform:translateY(0)}}
@keyframes bb-squash{0%{transform:scale(1.2,.8)}6%{transform:scale(.9,1.12)}18%,82%{transform:scale(1,1)}95%{transform:scale(.93,1.08)}100%{transform:scale(1.2,.8)}}
@keyframes bb-shade{0%{transform:scale(1.08);opacity:.62;animation-timing-function:cubic-bezier(.22,.72,.32,1)}50%{transform:scale(.52);opacity:.22;animation-timing-function:cubic-bezier(.62,0,.82,.32)}100%{transform:scale(1.08);opacity:.62}}
@keyframes bb-glance{0%{transform:translateY(5px) rotate(-4deg)}50%{transform:translateY(-4px) rotate(5deg)}100%{transform:translateY(5px) rotate(-4deg)}}
@keyframes bb-trail{0%,100%{opacity:.1}35%{opacity:.5}70%{opacity:.2}}
@keyframes bb-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes bb-idlehop{0%,30%,100%{transform:translateY(0)}4%{transform:translateY(0);animation-timing-function:cubic-bezier(.22,.72,.32,1)}15%{transform:translateY(-38px);animation-timing-function:cubic-bezier(.62,0,.82,.32)}26%{transform:translateY(0)}}
@keyframes bb-idlesquash{0%,32%,100%{transform:scale(1)}4%{transform:scale(1.12,.88)}7%{transform:scale(.94,1.08)}12%,23%{transform:scale(1)}26%{transform:scale(1.15,.85)}29%{transform:scale(.97,1.03)}}
@keyframes bb-idleshade{0%,4%,26%,100%{transform:scale(1.05);opacity:.6}15%{transform:scale(.62);opacity:.28}}
@media (prefers-reduced-motion:reduce){
  .ballsvg .ball,.ballsvg .squash,.ballsvg .shadow,.ballsvg .face,.ballsvg .eye,.ballsvg .trail circle{animation:none!important}
  .ballsvg.loop .ball{transform:translateY(-44px)}.ballsvg.loop .shadow{transform:scale(.62);opacity:.32}
}
.bb-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:42vh;color:var(--muted);font-weight:600;text-align:center}
.bb-loader .ballsvg{color:var(--muted)}
.celebrate-ball{width:96px;height:96px;animation:drop 1.15s cubic-bezier(.3,0,.4,1) both;filter:drop-shadow(0 10px 16px rgba(0,0,0,.2))}
.celebrate-ball svg{width:100%;height:100%;display:block}
@keyframes drop{0%{transform:translateY(-60vh);opacity:1}34%{transform:translateY(0) scale(1.12,.86)}50%{transform:translateY(-80px) scale(.96,1.04)}64%{transform:translateY(0) scale(1.06,.93)}76%{transform:translateY(-24px)}86%{transform:translateY(0);opacity:1}100%{transform:translateY(0) scale(.6);opacity:0}}
.burst{position:absolute;width:0;height:0}
.burst span{position:absolute;width:9px;height:9px;border-radius:50%;left:-4.5px;top:-4.5px;opacity:0;animation:burst .85s cubic-bezier(.1,.7,.3,1) .4s both}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.4)}}

/* ---------- Responsive building blocks ---------- */
/* Page wrappers. On phones they collapse (display:contents) so their children stack in one column. */
.split,.feed{display:flex;flex-direction:column;gap:var(--sec);min-width:0}
.gp,.gp-main,.gp-side{display:contents}
.club-split,.club-people,.pp,.pp-main,.pp-side{display:flex;flex-direction:column;gap:var(--sec);min-width:0}
/* One-column order on phones and tablets: name prompt, back, band, meter, actions, then the rest */
.inner > .notice{order:-3}
.inner > .back{order:-2}
.gp-main > .band,.gp-main > .meter-row,.gp-side > .notice,.gp-side > .cta,.gp-side > .paynote,.gp-side > .paid-line,.gp-side > .confirm,.gp-side > .nudge,.gp-side > .cal-add-row,.gp-side > .invite-field{order:-1}

.search:focus-within{border-color:var(--ink)}
.search-row{display:flex;gap:8px}
.search-row .search{flex:1;min-width:0}
.filters{display:flex;flex-direction:column;gap:12px}
.filters-btn{min-height:48px;border-radius:14px;padding:0 14px;gap:6px;font-size:14px}
.filters-btn b{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--accent);color:var(--on-accent);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.chip:disabled{opacity:.5;cursor:not-allowed}
.list-break{grid-column:1/-1}
.top-search{display:none}
.kbd{display:none;font:600 11px/1 var(--body);padding:3px 6px;border-radius:6px;border:1px solid var(--line-strong);color:var(--muted);background:var(--bg)}

/* Game card wrapper (lets a Quick join button sit beside the card link) */
.gwrap{position:relative;min-width:0;display:flex;flex-direction:column}
.gwrap > .game{flex:1}
.qjoin{display:none}

/* Desktop right rail on Discover */
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.rail h2{font-size:17px}
.rail-card{gap:10px}
.ralert{background:var(--hero-bg);color:var(--hero-fg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ralert .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ralert .sub{font-size:13px;color:var(--hero-muted)}
.ralert a{color:inherit;text-decoration:none;font-weight:800;font-size:15px;line-height:1.25}
.ralert a:hover{text-decoration:underline}
.next{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;padding:12px;border-radius:12px;background:var(--bg)}
.next .cd{font-family:var(--display);font-weight:800;font-size:20px;color:var(--brand-text)}
.mini-club{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 6px;margin:0 -6px;border-radius:10px;text-decoration:none;color:inherit}
.mini-club:hover{background:var(--bg)}
.mini-club .gbody{flex:1}
.mini-club b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Side menu extras: Your clubs (desktop) and your avatar (tablet rail) */
.side-extra,.side-clubs,.rail-me{display:none}
.side-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 12px 6px}
.side-club{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;min-width:0}
.side-club > span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-club[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.plus-sq{flex:none;width:28px;height:28px;border-radius:9px;border:1.5px dashed var(--line-strong);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}

/* Bottom sheets (filters, member menu) */
.sheet-back{position:fixed;inset:0;z-index:25;background:rgba(8,18,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet .grab{flex:none;width:40px;height:5px;border-radius:3px;background:var(--line-strong);align-self:center}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-menu{display:flex;flex-direction:column;gap:10px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);display:flex;flex-direction:column;gap:8px;padding:8px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-back.enter{animation:fade .2s ease-out}
.sheet-back.enter .sheet{animation:sheet-up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}
.btn.more{width:44px;min-height:44px;padding:0;font-size:20px;flex:none}

/* Host a game: four steps on phones, one sectioned page on wider screens */
.host-grid{display:flex;flex-direction:column;gap:14px}
.host-steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.step-head{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;background:transparent;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:16px}
.step-n{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--bg);color:var(--muted);border:1px solid var(--line-strong)}
.step.open .step-n{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.step.done .step-n{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.step-t{display:flex;flex-direction:column;min-width:0}
.step-t b{font-family:var(--display);font-size:17px}
.step-sum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-body{display:none;flex-direction:column;gap:14px;padding:2px 14px 16px}
.step.open .step-body{display:flex}
.step.open .step-sum{display:none}
.host-actions{display:flex;flex-direction:column;gap:10px}
.host-preview{display:flex;flex-direction:column;gap:10px}

/* Maps */
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.map{position:relative;height:200px;background:var(--brand-soft)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.map-foot{display:flex;align-items:center;gap:12px;padding:12px 14px}
.map-foot .gbody{flex:1}
.map-empty{border:1.5px dashed var(--line-strong);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
#where-map-slot .map{height:180px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pin-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill-sm{min-height:36px;padding:0 12px;font-size:13.5px;gap:6px;border-radius:10px}
.pill svg{width:16px;height:16px}
.check-plain{background:var(--bg);border:1px solid var(--line)}

/* Waitlist */
.waitlist{padding:4px 14px;gap:0}
.wpos{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}

/* Clubs: Feed / All clubs switch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg a{min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14.5px;color:var(--muted);text-decoration:none;transition:background-color .15s ease,color .15s ease}
.seg a[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Club feed posts */
.compose-prompt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font:inherit;color:var(--muted);text-align:left;cursor:pointer;width:100%}
.compose-prompt:hover{border-color:var(--line-strong)}
.posts{display:flex;flex-direction:column;gap:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.post-head{display:flex;align-items:center;gap:10px}
.post-head > a{flex:none;text-decoration:none}
.post-head .gbody{flex:1}
.post-club{font-weight:800;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-club:hover{text-decoration:underline}
.post-text{white-space:pre-line;overflow-wrap:anywhere;font-size:15px}
.post-text.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkish{align-self:flex-start;background:none;border:0;padding:0;margin-top:-6px;min-height:32px;font:inherit;font-weight:700;color:var(--brand-text);cursor:pointer}
.photos{display:grid;gap:4px;border-radius:14px;overflow:hidden;grid-template-columns:1fr 1fr}
.photos.n1{grid-template-columns:1fr}
.photo{display:block;padding:0;border:0;background:var(--bg);cursor:zoom-in;aspect-ratio:1/1;overflow:hidden}
.photos.n1 .photo{aspect-ratio:4/3}
.photos.n3 .photo:first-child{grid-row:span 2;aspect-ratio:auto}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.post-games{display:flex;flex-direction:column;gap:8px}
.pgame{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);min-width:0;flex-wrap:wrap}
.pgame-link{flex:1 1 220px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;color:inherit;min-width:0}
.pgame .when{background:var(--surface)}
.pgame-act{flex:none;margin-left:auto}
.post-foot{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:6px;margin-bottom:-4px}
.pf-btn{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:10px;font:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.pf-btn svg{width:20px;height:20px}
.pf-btn[aria-pressed="true"]{color:#E5484D}
.pf-btn[aria-pressed="true"] svg{fill:currentColor;animation:pop .25s ease-out}
.pf-btn[aria-expanded="true"]{color:var(--ink)}
.comments{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:8px;align-items:flex-start}
.cmt .bubble{max-width:none;flex:1}
.cmt .who{text-decoration:none}
.cmt-del{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.comments .compose{padding:0;border-top:0}
.composer textarea#pc-body{min-height:110px}
.composer-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.club-main{display:flex;flex-direction:column;gap:var(--sec);min-width:0}

/* Calendar */
.list-head h2 .meta{font-family:var(--body);font-weight:600;font-size:13px;margin-left:4px}
.list-head{align-items:center}
.seg.seg-sm{display:inline-grid;grid-template-columns:auto auto;gap:2px;padding:3px;border-radius:12px}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mine-tools{justify-content:space-between;flex-wrap:wrap}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-title{display:flex;flex-direction:column;align-items:center}
.cal-title b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.cal-nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal-wd .wd-rest{display:none}
.cal-day{min-height:48px;border-radius:12px;border:0;background:transparent;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:4px 0;transition:background-color .15s ease,transform .12s ease}
.cal-day:active{transform:scale(.94)}
.cal-n{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.cal-day.past{opacity:.45}
.cal-day.has{background:var(--brand-soft)}
.cal-day.today .cal-n{width:26px;height:26px;margin:-4px 0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent)}
.cal-day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dots{display:flex;align-items:center;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.dots i.me{background:var(--accent)}
.dots em{font-style:normal;font-size:10px;font-weight:800;color:var(--muted)}
.cal-day[aria-pressed="true"] .dots i{background:var(--bg)}
.cal-day[aria-pressed="true"] .dots i.me{background:var(--accent)}
.cal-legend{display:flex;gap:14px;justify-content:center}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block}
.lg.me{background:var(--accent)}
.cal-add-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (hover:hover){.cal-day:hover{background:var(--bg)}.cal-day.has:hover{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}}
@media (min-width:768px){.cal-wd .wd-rest{display:inline}.cal-day{min-height:64px}.cal{padding:16px}}

/* Inbox and chats */
.ib-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ib-filters::-webkit-scrollbar{display:none}
.ib-none{text-align:center;padding:24px 0}
.inbox{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.inbox-row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:74px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);transition:background-color .15s ease}
.inbox-row:last-child{border-bottom:0}
.inbox-row .gbody{flex:1;gap:3px}
.ib-top,.ib-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.ib-top b{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-top .meta{flex:none}
.ib-last{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib-last .tag{margin-right:2px}
.inbox-row.unread .ib-top b{font-weight:800}
.inbox-row.unread .ib-last{color:var(--ink);font-weight:600}
.inbox-row.unread .ib-top .meta{color:var(--accent-text);font-weight:700}
.ib-badge{flex:none;min-width:22px;height:22px;border-radius:11px;padding:0 7px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.ib-tile{flex:none;width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ib-tile small{font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.85}
.ib-tile b{font-family:var(--display);font-size:18px;line-height:1}
.ib-tile.ended{background:var(--line);color:var(--muted);padding-bottom:10px}
.ib-tile em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-align:center;background:var(--muted);color:var(--surface);padding:1px 0}
.tab-badge{position:absolute;top:5px;left:calc(50% + 3px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.chat-title{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit}
.chat-title .gbody{flex:1}
.chat-title b{font-size:16px}
.club-chat .msgs{max-height:none;height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:240px}
.day-sep{display:flex;justify-content:center;margin:2px 0}
.day-sep span{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:999px}
.msg.cont{margin-top:-6px}
.msg > a{flex:none;text-decoration:none}
.av-gap{width:28px;flex:none}
@media (hover:hover){.inbox-row:hover{background:var(--bg)}}
@media (min-width:768px){.club-chat .msgs{height:calc(100dvh - 300px)}}
@media (min-width:1024px){.tab-badge{position:static;margin-left:auto;box-shadow:none}.tab .kbd + .tab-badge{margin-left:8px}}

/* Notifications */
.nudge{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--accent-soft);color:var(--ink)}
.nudge .gbody{flex:1;gap:2px}
.nudge-ico{flex:none;width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.nudge-ico svg{width:20px;height:20px}
.howto{background:var(--bg);border-radius:12px;padding:12px 14px}
.howto ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pref-list{display:flex;flex-direction:column;gap:12px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
.pref-list .switch-row{padding-top:8px}

/* Photo viewer */
.lightbox{position:fixed;inset:0;z-index:26;background:rgba(5,10,8,.92);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(56px + env(safe-area-inset-bottom,0px))}
.lightbox.enter{animation:fade .2s ease-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb-close,.lb-nav{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-close{top:calc(8px + env(safe-area-inset-top,0px));right:12px}
.lb-prev{left:12px;top:50%;transform:translateY(-50%)}
.lb-next{right:12px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:14px}

/* Player hover card (desktop) */
.hovercard{position:fixed;z-index:22;width:280px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 34px rgba(15,31,26,.18);display:flex;flex-direction:column;gap:8px;pointer-events:none;animation:pop .16s ease-out}
.hovercard .profile-head{gap:10px}
.hovercard h3{font-size:17px}
.hovercard .bio{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Breakpoints (phone first: 375px base, then 481 / 768 / 1024 / 1280) ---------- */
/* Small phones */
@media (max-width:359px){
  .where{display:none}
  .facts{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:374px){
  .not-xs{display:none!important}
  .row2{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:375px){.only-xs{display:none!important}}
/* Phones: sticky action bars in the thumb zone */
@media (max-width:767px){
  .not-phone{display:none!important}
  .actionbar,.host-actions{position:sticky;bottom:0;z-index:5;margin:0 calc(-1 * var(--gut));padding:9px var(--gut);border-top:1px solid var(--line);background:var(--bg)}
  .gp-side > .actionbar{order:1}
  .actionbar .pill{flex:none;white-space:nowrap}
  .actionbar{flex-wrap:nowrap;align-items:center;min-height:var(--bar-h);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .inner:has(.actionbar),.inner:has(.host-actions){padding-bottom:0}
  .inner.pg-host{min-height:100%}
  #host-form{flex:1}
  .host-actions{margin-top:auto}
  body:has(.actionbar) #toast,body:has(.host-actions) #toast{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:768px){.only-phone{display:none!important}}
@media (max-width:1023px){.only-desk{display:none!important}}
@media (max-width:1279px){.only-wide{display:none!important}}
@media (min-width:1280px){.only-narrow{display:none!important}}

/* Large phone 481px+: centred 560px column, 24px gutters */
@media (min-width:481px){
  :root{--gut:24px}
  #app{max-width:608px;border-inline:1px solid var(--line)}
}

/* Tablet 768px+: 80px rail (icon over label), two game columns, 720px content */
@media (min-width:768px){
  #app{max-width:none;border-inline:0;display:grid;grid-template-columns:80px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1/-1}
  .where,.me-btn{display:none}
  .tabs{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:4px;background:transparent;border-top:0;border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto;scrollbar-width:none}
  .tab{min-height:64px;border-radius:12px;font-size:11px;text-align:center}
  .tab[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
  .tab[aria-current="page"]::after{top:14px;bottom:14px;left:0;transform:none;width:3px;height:auto;border-radius:0 3px 3px 0}
  .side-extra{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:12px}
  .rail-me{display:flex;justify-content:center;padding:6px 0;border-radius:12px}
  main{grid-column:2;grid-row:2}
  .inner{max-width:768px;margin:0 auto;padding-top:24px;padding-bottom:40px}
  .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .filters .scroller{flex-wrap:wrap;overflow:visible}
  .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .people{grid-template-columns:repeat(6,minmax(0,1fr))}
  .club-split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
  .pp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .club-split .list,.pp .list{display:flex;flex-direction:column}
  .step-head{cursor:default;pointer-events:none;min-height:0;padding:14px 14px 6px}
  .step .step-body{display:flex}
  .step .step-sum{display:none}
  .step .step-n,.step.open .step-n,.step.done .step-n{background:var(--brand-soft);color:var(--brand-text);border-color:transparent}
  #toast{bottom:24px}
  /* Sheets become small centred dialogs on wider screens */
  .sheet-back{align-items:center;padding:24px}
  .sheet{max-width:420px;border-radius:20px;padding-top:16px}
  .sheet .grab{display:none}
  .sheet-back.enter .sheet{animation:pop .22s ease-out}
  .inner.pg-feed{max-width:704px}
  .map{height:240px}
}

/* Small laptop 1024px+: 232px sidebar with Your clubs, 32px gutters, two-pane game page, host preview */
@media (min-width:1024px){
  :root{--gut:32px;--sec:24px}
  h1{font-size:34px}
  h2{font-size:21px}
  .band h1{font-size:30px}
  #app{grid-template-columns:232px minmax(0,1fr)}
  .top{display:grid;grid-template-columns:232px minmax(0,1fr) auto;padding-left:0}
  .wordmark{padding-left:24px}
  .top-right{grid-column:3}
  .me-btn{display:block}
  .tabs{padding:16px 12px}
  .tab{flex-direction:row;justify-content:flex-start;min-height:48px;padding:0 14px;gap:12px;font-size:15px;text-align:left}
  .tab[aria-current="page"]::after{top:12px;bottom:12px}
  .side-extra{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
  .side-clubs{display:flex;flex-direction:column;gap:2px}
  .rail-me{display:none}
  .inner{max-width:824px;padding-top:32px;padding-bottom:48px}
  .inner.pg-game,.inner.pg-host{max-width:1060px}
  .gp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
  .gp-main{display:flex;flex-direction:column;gap:var(--sec);min-width:0}
  .gp-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;min-width:0}
  .gp-side:has(.msgs){height:calc(100vh - var(--top-h) - 32px);height:calc(100dvh - var(--top-h) - 32px)}
  .gp-side .chat{flex:1 1 auto;min-height:0}
  .gp-side .msgs{flex:1 1 0;max-height:none;min-height:160px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .people{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .host-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
  .host-preview{position:sticky;top:16px}
  .host-actions{flex-direction:row}
}

/* Desktop 1280px+: centred frame of sidebar + feed + 320px right rail; search moves into the header */
@media (min-width:1280px){
  #app{max-width:1260px;border-inline:1px solid var(--line)}
  .top-search{display:flex;grid-column:2;align-items:center;gap:10px;width:360px;max-width:calc(100% - 32px);min-height:44px;margin-left:32px;padding:0 12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px}
  .top-search:focus-within{border-color:var(--ink)}
  .top-search svg{width:18px;height:18px;color:var(--muted);flex:none}
  .top-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
  .inner.pg-discover{max-width:none}
  .inner.pg-feed{max-width:1000px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
  .rail{position:sticky;top:16px;max-height:calc(100vh - var(--top-h) - 32px);max-height:calc(100dvh - var(--top-h) - 32px);overflow-y:auto;scrollbar-width:thin}
  .gp{grid-template-columns:minmax(0,1fr) 360px}
  .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
  #toast{left:calc(max(0px,(100vw - 1260px) / 2) + 264px);transform:none;bottom:24px}
}

/* Mouse and trackpad only: hover reveals, keyboard hints */
@media (hover:hover) and (min-width:768px){
  .tab:hover,.side-club:hover,.rail-me:hover{background:var(--surface);color:var(--ink)}
}
@media (hover:hover) and (min-width:1024px){
  .kbd{display:inline-block}
  .tab .kbd{margin-left:auto}
  .qjoin{display:inline-flex;position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;transition:opacity .15s ease;box-shadow:-14px 0 14px var(--surface)}
  .gwrap:hover .qjoin,.qjoin:focus-visible{opacity:1;pointer-events:auto}
  .qjoin:not(:disabled):active{transform:translateY(-50%) scale(.96)}
}
@media (hover:hover) and (min-width:1280px){
  .member-row .acts{opacity:0;transition:opacity .15s ease}
  .member-row:hover .acts,.member-row:focus-within .acts{opacity:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayKey(off){var d=new Date();d.setDate(d.getDate()+(off||0));return keyOf(d);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTime(d){var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'pm':'am';h=h%12||12;return m?h+':'+pad(m)+ap:h+ap;}
function fmtDay(d){var k=keyOf(d);if(k===dayKey(0))return 'Today';if(k===dayKey(1))return 'Tomorrow';return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function shortDow(d){var k=keyOf(d);if(k===dayKey(0))return 'Today';if(k===dayKey(1))return 'Tmrw';return DOW[d.getDay()];}
function endOf(g){return new Date(g.start.getTime()+g.durationMin*60000);}
function isUpcoming(g){return endOf(g).getTime()>Date.now();}
function priceLabel(g){return g.price>0?'$'+g.price:'Free';}
function spotsLeft(g,count){return Math.max(0,g.capacity-(count==null?g.count:count));}
function place(g,sep){return [g.venue,g.suburb].filter(Boolean).join(sep||' · ');}
function startsLabel(g){
  var mins=Math.round((g.start.getTime()-Date.now())/60000);
  if(mins<=0)return 'On now';
  if(mins<60)return 'Starts in '+mins+' min';
  if(mins<180)return 'Starts in '+Math.floor(mins/60)+'h '+(mins%60)+'m';
  return fmtDay(g.start)+' · '+fmtTime(g.start);
}
/* The 3D Bounce ball (same drawing as the header logo). Gradients live in the hidden <svg> at the top of <body>. */

    '<path d="M136.7 180.8 Q156 198 175.3 180.8" fill="none" stroke="#1A0E05" stroke-width="7.6" stroke-linecap="round"/>'+

function colorFor(id){var h=0;id=String(id||'');for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return AV_COLORS[h%AV_COLORS.length];}

/* Maps: an embedded Google map plus a Directions link that opens Google Maps (app or web) */
function hasPin(o){return o&&o.lat!=null&&o.lng!=null;}
function mapQ(o){return hasPin(o)?o.lat.toFixed(6)+','+o.lng.toFixed(6):[o.venue,o.address,o.suburb].filter(Boolean).join(', ')+', Australia';}

function sportsChips(list){return list.length?'<div class="chips-sm">'+list.map(function(s){return '<span>'+esc(SPORT_LABEL[s])+'</span>';}).join('')+'</div>':'';}
function sortClubs(list){
  var home=S.profile&&S.profile.suburb?S.profile.suburb.trim().toLowerCase():'';
  var mine=S.profile&&S.profile.sports?S.profile.sports:[];
  return list.slice().sort(function(a,b){
    var ha=home&&a.suburb.toLowerCase()===home?0:1,hb=home&&b.suburb.toLowerCase()===home?0:1;
    if(ha!==hb)return ha-hb;
    var sa=a.sports.some(function(s){return mine.indexOf(s)>=0;})?0:1,sb2=b.sports.some(function(s){return mine.indexOf(s)>=0;})?0:1;
    if(sa!==sb2)return sa-sb2;
    return b.members-a.members||a.name.localeCompare(b.name);
  });
}
function byStart(a,b){return a.start-b.start;}
function homeSuburb(){return S.profile&&S.profile.suburb?S.profile.suburb.trim().toLowerCase():'';}
function countdown(d){
  var mins=Math.round((d.getTime()-Date.now())/60000);
  if(mins<=0)return 'On now';
  if(mins<60)return 'Starts in '+mins+' min';
  if(mins<1440)return 'Starts in '+Math.floor(mins/60)+'h '+(mins%60)+'m';
  var days=Math.round(mins/1440);return 'In '+days+(days===1?' day':' days');
}
function filterCount(){return (S.sport!=='all'?1:0)+(S.day!=='all'?1:0)+(S.level!=='all'?1:0)+(S.free?1:0)+(S.near?1:0);}
function filterGames(up,ignoreDay){
  var q=S.q.trim().toLowerCase(),home=homeSuburb();
  var list=up.filter(function(g){
    if(S.sport!=='all'&&g.sport!==S.sport)return false;
    if(!ignoreDay&&S.day!=='all'&&keyOf(g.start)!==S.day)return false;
    if(S.level!=='all'&&g.level!==S.level&&g.level!=='All levels')return false;
    if(S.free&&g.price>0)return false;
    if(S.near&&home&&g.suburb.trim().toLowerCase()!==home)return false;
    return !q||[g.title,g.venue,g.suburb,SPORT_LABEL[g.sport],g.level,g.club&&g.club.name].join(' ').toLowerCase().indexOf(q)>=0;
  });
  if(home)list.sort(function(a,b){var da=keyOf(a.start),db=keyOf(b.start);if(da!==db)return da<db?-1:1;var ha=a.suburb.toLowerCase()===home?0:1,hb=b.suburb.toLowerCase()===home?0:1;return ha-hb||a.start-b.start;});
  return list;
}

function friendlyError(e,fallback){
  var m=String((e&&e.message)||'');
  if(m.indexOf('GAME_FULL')>=0)return 'That game just filled up.';
  if(m.indexOf('GAME_FINISHED')>=0)return 'That game has already finished.';
  if(m.indexOf('GAME_NOT_FOUND')>=0)return 'That game isn’t there anymore.';
  if(m.indexOf('SPOT_OPEN')>=0)return 'A spot just opened up. Tap I’m in to grab it.';
  if(m.indexOf('ALREADY_IN')>=0)return 'You’re already in this game.';
  if(m.indexOf('LAST_ADMIN')>=0)return 'A club needs at least one committee member. Make someone else committee first, or close the club.';
  if(m.indexOf('PAYOUTS_NOT_READY')>=0)return 'Set up payouts before asking players to pay in the app.';
  if(m.indexOf('PAYMENT_REQUIRED')>=0)return 'This game takes payment when you join.';
  if(m.indexOf('HAS_PAYMENTS')>=0)return 'Players have already paid, so the price can’t change.';
  if(m.indexOf('CLINIC_NEEDS_COACH')>=0)return 'Only coaches can post a clinic. List yourself as a coach first.';
  if(/duplicate key/i.test(m))return 'That’s already done.';
  if(/violates check constraint/i.test(m))return 'Something in the form isn’t valid. Check the fields and try again.';
  if(/fetch|network/i.test(m))return 'You seem to be offline. Check your connection and try again.';
  return fallback;
}

var HOST_STEPS=['What','When','Where','Cost and notes'];
function durLabel(v){for(var i=0;i<DURATIONS.length;i++)if(DURATIONS[i][0]===v)return DURATIONS[i][1];return '';}
function hostSummary(i){
  var f=S.form;
  if(i===0)return [SPORT_LABEL[f.sport],f.level,f.title.trim()].filter(Boolean).join(' · ');
  if(i===1){var d=new Date(f.date+'T'+f.time),n=Math.round(Number(f.need));return [isNaN(d.getTime())?'':fmtDay(d)+' '+fmtTime(d),durLabel(f.duration),n>0?'need '+n+(f.hostPlays?' + you':''):''].filter(Boolean).join(' · ');}
  if(i===2)return [f.venue.trim(),f.address.trim(),f.suburb.trim()].filter(Boolean).join(', ')||(hasPin(f)?'Pinned on the map':'Add the venue and suburb');
  var p=Math.round(Number(f.price));return (p>0?'$'+p+' per player':'Free')+(f.oneShort?' · One Short alert':'');
}
function previewHTML(){
  var f=S.form,d=new Date(f.date+'T'+f.time);
  if(isNaN(d.getTime())){d=new Date();d.setDate(d.getDate()+1);d.setHours(18,30,0,0);}
  var club=null;
  if(f.clubId){var m=S.myClubs.filter(function(x){return x.club&&String(x.club.id)===f.clubId;})[0];if(m)club={id:m.club.id,name:m.club.name};}
  var cap=formCapacity(f);if(!(cap>=1&&cap<=50))cap=8;
  return cardHTML({id:'preview',sport:f.sport,title:f.title.trim()||'Your game name',start:d,durationMin:Number(f.duration)||90,venue:f.venue.trim()||'Venue',suburb:f.suburb.trim()||'Suburb',
    level:f.level,price:Math.max(0,Math.round(Number(f.price))||0),capacity:cap,oneShort:!!f.oneShort,count:f.hostPlays?1:0,club:club},true);
}
function updatePreview(){
  var el=document.getElementById('host-preview');if(el)el.innerHTML=previewHTML();
  var t=document.getElementById('f-total');if(t)t.textContent=totalLine(S.form);
}
function totalLine(f){var c=formCapacity(f);return c>0?'Total spots: '+c+(f.hostPlays?' (you + '+(c-1)+')':'')+'. When they fill, players can join the waitlist.':'';}
function whereMap(f){
  if(!hasPin(f)&&!f.venue.trim()&&!f.address.trim())return '<p class="map-empty">Add the venue or street address to check it on the map.</p>';
  return mapFrame({venue:f.venue.trim(),address:f.address.trim(),suburb:f.suburb.trim(),lat:f.lat,lng:f.lng},f.venue||'game location','where-map');
}
var mapTimer=null;
function updateWhereMap(){
  clearTimeout(mapTimer);
  mapTimer=setTimeout(function(){
    var slot=document.getElementById('where-map-slot');if(!slot)return;
    var fr=document.getElementById('where-map'),html=whereMap(S.form);
    if(fr&&html.indexOf('<iframe')>=0){var src=mapSrc({venue:S.form.venue.trim(),address:S.form.address.trim(),suburb:S.form.suburb.trim(),lat:S.form.lat,lng:S.form.lng});if(fr.getAttribute('src')!==src)fr.setAttribute('src',src);}
    else slot.innerHTML=html;
  },900);
}
function hostErrors(){
  var f=S.form,need=Math.round(Number(f.need)),cap=formCapacity(f),price=Math.round(Number(f.price)),start=new Date(f.date+'T'+f.time);
  if(f.title.trim().length<3)return [0,'Give your game a name, like “Social doubles”.'];
  if(!f.date||!f.time||isNaN(start.getTime()))return [1,'Pick a date and start time.'];
  if(start.getTime()<Date.now())return [1,'That time has already passed. Pick a later one.'];
  if(!(need>=1))return [1,'Add how many players you’re looking for.'];
  if(cap>50)return [1,'A game can have up to 50 players.'];
  if(!f.venue.trim())return [2,'Add the venue so players know where to go.'];
  if(!f.suburb.trim())return [2,'Add the suburb.'];
  if(f.sport==='pickleball'&&((f.duprMin!==''&&duprNum(f.duprMin)==null)||(f.duprMax!==''&&duprNum(f.duprMax)==null)))return [0,'DUPR ratings go from 2.0 to 8.0.'];
  if(f.sport==='pickleball'&&duprNum(f.duprMin)!=null&&duprNum(f.duprMax)!=null&&duprNum(f.duprMin)>duprNum(f.duprMax))return [0,'The lower DUPR is above the upper one.'];
  if(!(price>=0&&price<=500))return [3,'Cost must be between $0 and $500.'];
  return null;
}
function hostNext(){
  var e=hostErrors();
  if(e&&e[0]<=S.hostStep){S.formError=e[1];S.hostStep=e[0];render();return;}
  S.formError='';S.hostStep=Math.min(3,S.hostStep+1);render();
  var el=document.querySelector('.step.open');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

var PHOTO_PREFIX=String(CONFIG.SUPABASE_URL).replace(/\/$/,'')+'/storage/v1/object/public/club-photos/';
function isPhotoUrl(u){return typeof u==='string'&&u.indexOf(PHOTO_PREFIX)===0&&/^[A-Za-z0-9\/_.-]+$/.test(u.slice(PHOTO_PREFIX.length));}
function normPost(r){
  r=r||{};
  return {id:String(r.id),clubId:String(r.club_id),club:r.club||{id:r.club_id,name:'Club'},authorId:r.author_id,author:r.author||null,
    body:String(r.body||''),photos:(r.photos||[]).filter(isPhotoUrl).slice(0,4),gameIds:(r.game_ids||[]).filter(function(x){return ID_RE.test(String(x));}).slice(0,3),
    createdAt:new Date(r.created_at),likes:(r.post_likes&&r.post_likes[0]&&r.post_likes[0].count)||0,comments:(r.post_comments&&r.post_comments[0]&&r.post_comments[0].count)||0};
}
function timeAgo(d){
  var s=Math.round((Date.now()-d.getTime())/1000);
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<172800)return 'yesterday';if(s<604800)return Math.floor(s/86400)+' days ago';
  return d.getDate()+' '+MON[d.getMonth()];
}
function findGame(id){
  for(var i=0;i<S.games.length;i++)if(S.games[i].id===id)return S.games[i];
  return S.gameCache[id]||null;
}
function canModerate(p){return !!S.uid&&(p.authorId===S.uid||isClubAdmin(p.clubId));}

/* ---------- Calendar: month view of games, and export to phone calendars ---------- */
var MONTHS_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function viewToggle(act,cur){
  return '<div class="seg seg-sm" role="group" aria-label="View"><button type="button" data-act="'+act+'" data-v="list" aria-pressed="'+(cur!=='cal')+'">List</button>'+

/* key: which calendar (discover, mine, club). games: what to show. opts.allowPast lets the month go backwards. */
function calendarHTML(key,games,opts){
  opts=opts||{};
  var now=new Date(),st=S.cal[key];
  if(!st)st=S.cal[key]={m:monthKey(now),d:null};
  var y=Number(st.m.slice(0,4)),mo=Number(st.m.slice(5,7))-1,first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate();
  var lead=(first.getDay()+6)%7,todayK=dayKey(0),thisMonth=monthKey(now);
  var byDay={};games.forEach(function(g){var k=keyOf(g.start);(byDay[k]=byDay[k]||[]).push(g);});
  var monthCount=0;Object.keys(byDay).forEach(function(k){if(k.slice(0,7)===st.m)monthCount+=byDay[k].length;});
  var canPrev=opts.allowPast||st.m>thisMonth;
  var h='<section class="cal" aria-label="Calendar"><div class="cal-head">'+
    '<button type="button" class="cal-nav" data-act="cal-month" data-v="'+key+'|-1"'+(canPrev?'':' disabled')+' aria-label="Previous month">‹</button>'+
    '<div class="cal-title"><b>'+MONTHS_LONG[mo]+' '+y+'</b><span class="meta">'+monthCount+(monthCount===1?' game':' games')+'</span></div>'+
    '<button type="button" class="cal-nav" data-act="cal-month" data-v="'+key+'|1" aria-label="Next month">›</button></div>';
  h+='<div class="cal-grid" role="grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(w){return '<span class="cal-wd" aria-hidden="true">'+w.charAt(0)+'<span class="wd-rest">'+w.slice(1)+'</span></span>';}).join('');
  for(var b=0;b<lead;b++)h+='<span class="cal-blank"></span>';
  for(var d=1;d<=days;d++){
    var k=y+'-'+pad(mo+1)+'-'+pad(d),list=byDay[k]||[],past=k<todayK;
    var mine=list.filter(function(g){return S.myIds[g.id]||S.waitIds[g.id]||(S.uid&&g.hostId===S.uid);}).length;
    var dots='';for(var i=0;i<Math.min(list.length,3);i++)dots+='<i'+(i<mine?' class="me"':'')+'></i>';
    var dt=new Date(y,mo,d);
    h+='<button type="button" class="cal-day'+(k===todayK?' today':'')+(past?' past':'')+(list.length?' has':'')+'" data-act="cal-day" data-v="'+key+'|'+k+'" aria-pressed="'+(st.d===k)+'" aria-label="'+esc(DOW[dt.getDay()]+' '+d+' '+MONTHS_LONG[mo]+', '+(list.length?list.length+(list.length===1?' game':' games'):'no games'))+'">'+
      '<span class="cal-n">'+d+'</span><span class="dots">'+dots+(list.length>3?'<em>+'+(list.length-3)+'</em>':'')+'</span></button>';
  }
  h+='</div><div class="cal-legend meta"><span><i class="lg"></i>Games</span>'+(S.uid?'<span><i class="lg me"></i>Yours</span>':'')+'</div></section>';
  // Below the month: the chosen day, or what's coming up this month
  var sel=st.d&&st.d.slice(0,7)===st.m?st.d:null,shown,label;
  if(sel){shown=(byDay[sel]||[]).slice().sort(byStart);label=fmtDay(new Date(sel+'T00:00'));}
  else{shown=games.filter(function(g){return monthKey(g.start)===st.m&&(opts.allowPast||isUpcoming(g));}).sort(byStart);label=(st.m===thisMonth?'Coming up this month':'In '+MONTHS_LONG[mo]);}
  h+='<div class="list"><div class="list-head"><h2>'+esc(label)+'</h2><span class="meta">'+shown.length+(shown.length===1?' game':' games')+'</span></div>'+
    (shown.length?shown.map(function(g){return cardHTML(g);}).join(''):'<p class="meta">'+(sel?'No games this day.':'No games this month yet.')+'</p>')+'</div>';
  return h;
}
/* .ics file (iPhone Calendar, Outlook) and Google Calendar link */
function icsDate(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function icsText(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');}
function icsFold(line){var out='';while(line.length>73){out+=line.slice(0,73)+'\r\n ';line=line.slice(73);}return out+line;}
function gameUrl(g){return location.origin+location.pathname+'#g-'+g.id;}
function gameWhere(g){return [g.venue,g.address,g.suburb].filter(Boolean).join(', ');}
function gameNote(g){return [g.club&&g.club.name?'Hosted by '+g.club.name:'',g.level,g.price>0?'$'+g.price+' per player':'Free'].filter(Boolean).join(' · ');}
function buildIcs(games){
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bounce//Bounce AU//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Bounce games'];
  games.forEach(function(g){
    lines.push('BEGIN:VEVENT','UID:game-'+g.id+'@bounce-au.netlify.app','DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(g.start),'DTEND:'+icsDate(endOf(g)),
      'SUMMARY:'+icsText(SPORT_LABEL[g.sport]+': '+g.title),'LOCATION:'+icsText(gameWhere(g)),
      'DESCRIPTION:'+icsText(gameNote(g)+'\nGame page: '+gameUrl(g)),'URL:'+gameUrl(g));
    if(hasPin(g))lines.push('GEO:'+g.lat.toFixed(6)+';'+g.lng.toFixed(6));
    lines.push('BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:'+icsText(g.title+' starts in 1 hour'),'END:VALARM','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n');
}
function downloadIcs(games,name){
  if(!games.length){toast('No upcoming games to add.');return;}
  try{
    var blob=new Blob([buildIcs(games)],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name.replace(/[^A-Za-z0-9 _-]/g,'').trim().slice(0,40)||'bounce';a.download+='.ics';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},4000);
    toast(games.length===1?'Calendar file ready. Open it to add the game.':'Calendar file ready. Open it to add '+games.length+' games.');
  }catch(e){toast('This browser can’t make calendar files. Try Google Calendar instead.');}
}
function googleCalUrl(g){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(SPORT_LABEL[g.sport]+': '+g.title)+
    '&dates='+icsDate(g.start)+'/'+icsDate(endOf(g))+'&details='+encodeURIComponent(gameNote(g)+'\n'+gameUrl(g))+'&location='+encodeURIComponent(gameWhere(g));
}
function lookupGame(id){
  if(S.game&&S.game.id===id)return S.game;
  var g=findGame(id);if(g)return g;
  var pools=(S.mine||[]).concat(S.myWait||[],S.clubGames||[]);
  for(var i=0;i<pools.length;i++)if(pools[i].id===id)return pools[i];
  return null;
}
function myUpcoming(){
  var seen={},out=[];(S.mine||[]).concat(S.myWait||[]).forEach(function(g){if(isUpcoming(g)&&!seen[g.id]){seen[g.id]=1;out.push(g);}});
  return out.sort(byStart);
}

function shortWhen(d){
  var k=keyOf(d);if(k===dayKey(0))return fmtTime(d);if(k===dayKey(-1))return 'Yesterday';
  if(Date.now()-d.getTime()<6*86400000)return DOW[d.getDay()];return d.getDate()+' '+MON[d.getMonth()];
}
function markRead(key){
  if(!S.uid||!/^(club|game):[0-9a-f-]{36}$/.test(key))return;
  var now=new Date().toISOString();S.reads[key]=now;
  (S.inbox||[]).forEach(function(it){if(it.key===key)it.unread=0;});
  S.unread=(S.inbox||[]).reduce(function(n,it){return n+it.unread;},0);
  sb.from('chat_reads').upsert({user_id:S.uid,chat_key:key,read_at:now}).then(function(){});
}
function loadInbox(){
  if(!S.uid){S.inbox=[];S.unread=0;return Promise.resolve();}
  var clubs=S.myClubs.filter(function(m){return m.club;}).map(function(m){return normClub(m.club);});
  var games=(S.mine||[]).filter(function(g){return isUpcoming(g)||Date.now()-endOf(g).getTime()<14*86400000;});
  var cids=clubs.map(function(c){return c.id;}),gids=games.map(function(g){return g.id;});
  return Promise.all([
    cids.length?sb.from('club_messages').select('id, club_id, body, created_at, user_id, profile:profiles(id, display_name)').in('club_id',cids).order('created_at',{ascending:false}).limit(300):Promise.resolve({data:[]}),
    gids.length?sb.from('messages').select('id, game_id, body, created_at, user_id, profile:profiles(id, display_name)').in('game_id',gids).order('created_at',{ascending:false}).limit(300):Promise.resolve({data:[]}),
    sb.from('chat_reads').select('chat_key, read_at').eq('user_id',S.uid)
  ]).then(function(res){
    if(!res[2].error)(res[2].data||[]).forEach(function(r){if(!S.reads[r.chat_key]||S.reads[r.chat_key]<r.read_at)S.reads[r.chat_key]=r.read_at;});
    function summarise(key,rows){
      var read=S.reads[key]?new Date(S.reads[key]).getTime():0,last=rows[0]||null,unread=0;
      rows.forEach(function(m){if(m.user_id!==S.uid&&new Date(m.created_at).getTime()>read)unread++;});
      return {last:last,unread:unread};
    }
    var cm=res[0].error?[]:(res[0].data||[]),gm=res[1].error?[]:(res[1].data||[]),items=[];
    clubs.forEach(function(c){
      var sm=summarise('club:'+c.id,cm.filter(function(m){return String(m.club_id)===c.id;}));
      items.push({kind:'club',key:'club:'+c.id,id:c.id,title:c.name,club:c,last:sm.last,unread:sm.unread,at:sm.last?new Date(sm.last.created_at):new Date(0)});
    });
    games.forEach(function(g){
      var rows=gm.filter(function(m){return String(m.game_id)===g.id;});
      if(!rows.length&&!isUpcoming(g))return;
      var sm=summarise('game:'+g.id,rows);
      items.push({kind:'game',key:'game:'+g.id,id:g.id,title:g.title,game:g,last:sm.last,unread:sm.unread,at:sm.last?new Date(sm.last.created_at):new Date(g.start.getTime()-30*86400000)});
    });
    items.sort(function(a,b){return b.at-a.at;});
    S.inbox=items;S.unread=items.reduce(function(n,it){return n+it.unread;},0);
  });
}
